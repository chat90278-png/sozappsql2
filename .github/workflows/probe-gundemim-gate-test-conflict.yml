name: Probe Current Gündemim Gate Test Conflict

on:
  push:
    branches:
      - integration/gundemim-after-activity-20260714
    paths:
      - .github/workflows/probe-gundemim-gate-test-conflict.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/gundemim-after-activity-20260714
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin integration/gundemim-current-main-20260713
          set +e
          git merge --no-commit --no-ff origin/integration/gundemim-current-main-20260713
          set -e
          python - <<'PY' > "$RUNNER_TEMP/conflict.md"
          from pathlib import Path
          path = Path('tests/test_sts_schema_upgrade_gate.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          print('# Current Schema Gate Test Conflict')
          print()
          index = 0
          region = 0
          while index < len(lines):
              if not lines[index].startswith('<<<<<<< '):
                  index += 1
                  continue
              region += 1
              start = max(0, index - 12)
              end = index
              while end < len(lines) and not lines[end].startswith('>>>>>>> '):
                  end += 1
              end = min(len(lines), end + 13)
              print(f'## Region {region}')
              print('```text')
              for line_no in range(start, end):
                  print(f'{line_no + 1:04d}: {lines[line_no]}')
              print('```')
              index = end
          PY
          BASE_HEAD="$(git rev-parse HEAD)"
          git merge --abort
          mkdir -p docs/agenda
          cp "$RUNNER_TEMP/conflict.md" docs/agenda/GUNDEMIM_GATE_TEST_CONFLICT.md
          git add docs/agenda/GUNDEMIM_GATE_TEST_CONFLICT.md
          git commit -m 'docs: record current schema gate test conflict'
          git push origin HEAD:integration/gundemim-after-activity-20260714
