name: Patch Remaining Activity Schema v19 Tests

on:
  push:
    branches:
      - integration/gundemim-after-activity-20260714
    paths:
      - .github/workflows/probe-gundemim-gate-test-conflict.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/gundemim-after-activity-20260714
          fetch-depth: 0
      - name: Patch exact combined-schema assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_activity_history_infrastructure.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'assert CURRENT_SCHEMA_VERSION == ACTIVITY_SCHEMA_VERSION == 18',
              'assert CURRENT_SCHEMA_VERSION == 19\n        assert ACTIVITY_SCHEMA_VERSION == 18',
          )
          path.write_text(text, encoding='utf-8')
          assert 'CURRENT_SCHEMA_VERSION == ACTIVITY_SCHEMA_VERSION' not in text
          assert 'assert CURRENT_SCHEMA_VERSION == 19' in text
          assert 'assert ACTIVITY_SCHEMA_VERSION == 18' in text
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_activity_history_infrastructure.py
          git diff --cached --check
          git commit -m 'test: separate current and activity schema assertions'
          git push origin HEAD:integration/gundemim-after-activity-20260714
