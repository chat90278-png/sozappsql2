name: Patch Remaining Activity Schema v19 Tests

on:
  push:
    branches:
      - integration/gundemim-after-activity-20260714
    paths:
      - .github/workflows/probe-gundemim-gate-test-conflict.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/gundemim-after-activity-20260714
          fetch-depth: 0
      - name: Patch exact combined-schema assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_activity_history_infrastructure.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('fetchone()[0]) == 18', 'fetchone()[0]) == 19')
          text = text.replace('"CURRENT_SCHEMA_VERSION = 18"', '"CURRENT_SCHEMA_VERSION = 19"')
          path.write_text(text, encoding='utf-8')
          assert 'fetchone()[0]) == 18' not in text
          assert '"CURRENT_SCHEMA_VERSION = 18"' not in text
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_activity_history_infrastructure.py
          git diff --cached --check
          git commit -m 'test: align activity infrastructure schema assertions with v19'
          git push origin HEAD:integration/gundemim-after-activity-20260714
