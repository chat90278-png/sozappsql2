name: Gündemim Post-Activity Controlled Integration

on:
  push:
    branches:
      - integration/gundemim-after-activity-20260714
    paths:
      - .github/workflows/gundemim-post-activity-integration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-validate:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      SOURCE_BRANCH: integration/gundemim-current-main-20260713
      TARGET_BRANCH: integration/gundemim-after-activity-20260714
      EXPECTED_SOURCE_HEAD: 66681d51877ad09db7379b6bbd7049a7436af1fc
      REQUIRED_MAIN_ANCESTOR: 9ec9bded1a51fd6d4cf94e9f20f36134a709aebe
    steps:
      - name: Checkout exact target branch
        uses: actions/checkout@v4
        with:
          ref: integration/gundemim-after-activity-20260714
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Merge and resolve Activity plus Agenda schema v19
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin "$SOURCE_BRANCH" "$TARGET_BRANCH"

          TARGET_PREMERGE_HEAD="$(git rev-parse HEAD)"
          SOURCE_HEAD="$(git rev-parse "origin/$SOURCE_BRANCH")"
          test "$SOURCE_HEAD" = "$EXPECTED_SOURCE_HEAD"
          git merge-base --is-ancestor "$REQUIRED_MAIN_ANCESTOR" HEAD
          echo "TARGET_PREMERGE_HEAD=$TARGET_PREMERGE_HEAD" >> "$GITHUB_ENV"
          echo "SOURCE_HEAD=$SOURCE_HEAD" >> "$GITHUB_ENV"

          set +e
          git merge --no-commit --no-ff "origin/$SOURCE_BRANCH"
          MERGE_EXIT=$?
          set -e
          test "$MERGE_EXIT" -eq 1

          python - <<'PY'
          from pathlib import Path

          def resolve_conflicts(path: str, handler) -> str:
              file_path = Path(path)
              lines = file_path.read_text(encoding='utf-8').splitlines()
              output: list[str] = []
              index = 0
              conflict_no = 0
              while index < len(lines):
                  if not lines[index].startswith('<<<<<<< '):
                      output.append(lines[index])
                      index += 1
                      continue
                  conflict_no += 1
                  index += 1
                  ours: list[str] = []
                  while index < len(lines) and lines[index] != '=======':
                      ours.append(lines[index])
                      index += 1
                  if index >= len(lines):
                      raise RuntimeError(f'{path}: missing conflict separator')
                  index += 1
                  theirs: list[str] = []
                  while index < len(lines) and not lines[index].startswith('>>>>>>> '):
                      theirs.append(lines[index])
                      index += 1
                  if index >= len(lines):
                      raise RuntimeError(f'{path}: missing conflict end')
                  index += 1
                  output.extend(handler(conflict_no, ours, theirs))
              resolved = '\n'.join(output) + '\n'
              if any(marker in resolved for marker in ('<<<<<<< ', '=======', '>>>>>>> ')):
                  raise RuntimeError(f'{path}: unresolved conflict marker')
              file_path.write_text(resolved, encoding='utf-8')
              return resolved

          def database_handler(_number: int, ours: list[str], theirs: list[str]) -> list[str]:
              ours_text = '\n'.join(ours)
              theirs_text = '\n'.join(theirs)
              if 'ACTIVITY_LOG_COLUMNS' in ours_text and 'AGENDA_STATE_COLUMNS' in theirs_text:
                  return ours + [''] + theirs
              if 'Own the outer transaction and use unique savepoints' in ours_text:
                  return ours
              raise RuntimeError('Unexpected sts_database conflict')

          database = resolve_conflicts('src/services/sts_database.py', database_handler)
          database = database.replace('CURRENT_SCHEMA_VERSION = 18', 'CURRENT_SCHEMA_VERSION = 19', 1)
          Path('src/services/sts_database.py').write_text(database, encoding='utf-8')
          assert 'ACTIVITY_LOG_COLUMNS' in database
          assert 'AGENDA_STATE_COLUMNS' in database
          assert 'def ensure_staff_agenda_state_schema' in database
          assert 'CURRENT_SCHEMA_VERSION = 19' in database
          assert 'Own the outer transaction and use unique savepoints' in database

          def upgrade_handler(number: int, ours: list[str], theirs: list[str]) -> list[str]:
              ours_text = '\n'.join(ours)
              theirs_text = '\n'.join(theirs)
              if number == 1 and 'ACTIVITY_LOG_COLUMNS' in ours_text and 'ensure_staff_agenda_state_schema' in theirs_text:
                  return ours + [
                      '',
                      '',
                      'def _migrate_18_to_19(conn: sqlite3.Connection) -> None:',
                      '    ensure_staff_agenda_state_schema(conn)',
                  ]
              if 'v17_to_v18_activity_history_infrastructure' in ours_text:
                  return ours + [
                      '    MigrationStep(18, 19, "v18_to_v19_staff_agenda_state", _migrate_18_to_19),'
                  ]
              raise RuntimeError('Unexpected sts_schema_upgrade conflict')

          upgrade = resolve_conflicts('src/services/sts_schema_upgrade.py', upgrade_handler)
          if '    ensure_staff_agenda_state_schema,\n' not in upgrade:
              upgrade = upgrade.replace(
                  '    STSMigrationError,\n',
                  '    STSMigrationError,\n    ensure_staff_agenda_state_schema,\n',
                  1,
              )
          Path('src/services/sts_schema_upgrade.py').write_text(upgrade, encoding='utf-8')
          assert 'v17_to_v18_activity_history_infrastructure' in upgrade
          assert 'v18_to_v19_staff_agenda_state' in upgrade
          assert 'def _migrate_18_to_19' in upgrade

          def gate_handler(number: int, ours: list[str], theirs: list[str]) -> list[str]:
              if number == 1:
                  activity: list[str] = []
                  for line in ours:
                      if line.startswith('FINGERPRINT_MIN_VERSION'):
                          break
                      activity.append(line)
                  agenda: list[str] = []
                  for line in theirs:
                      if line.startswith('FINGERPRINT_MIN_VERSION'):
                          break
                      agenda.append(
                          line.replace('_V18_AGENDA_STATE_COLUMNS', '_V19_AGENDA_STATE_COLUMNS')
                              .replace('_V18_INDEXES', '_V19_AGENDA_INDEXES')
                      )
                  return activity + [''] + agenda + [
                      '',
                      'FINGERPRINT_MIN_VERSION = VERSIONED_MIGRATION_FLOOR',
                      'FINGERPRINT_MAX_VERSION = CURRENT_SCHEMA_VERSION',
                  ]
              if number == 2:
                  agenda_body = [
                      line.replace('_V18_AGENDA_STATE_COLUMNS', '_V19_AGENDA_STATE_COLUMNS')
                          .replace('_V18_INDEXES', '_V19_AGENDA_INDEXES')
                      for line in theirs
                  ]
                  return ours + ['    if version >= 19:'] + agenda_body
              raise RuntimeError('Unexpected sts_schema_upgrade_gate conflict')

          gate = resolve_conflicts('src/services/sts_schema_upgrade_gate.py', gate_handler)
          Path('src/services/sts_schema_upgrade_gate.py').write_text(gate, encoding='utf-8')
          assert '_V18_ACTIVITY_COLUMNS' in gate
          assert '_V19_AGENDA_STATE_COLUMNS' in gate
          assert 'if version >= 18:' in gate
          assert 'if version >= 19:' in gate
          assert 'required_primary_keys' in gate
          assert 'forbidden_tables' in gate
          assert 'FINGERPRINT_MAX_VERSION = CURRENT_SCHEMA_VERSION' in gate

          def migration_test_handler(_number: int, ours: list[str], _theirs: list[str]) -> list[str]:
              return ours + ['        "v18_to_v19_staff_agenda_state",']

          migration_tests = resolve_conflicts('tests/test_sts_schema_upgrade.py', migration_test_handler)
          migration_tests = migration_tests.replace(
              'CURRENT_SCHEMA_VERSION == 18', 'CURRENT_SCHEMA_VERSION == 19'
          ).replace(
              'read_sts_schema_version(path) == 18',
              'read_sts_schema_version(path) == 19',
          ).replace(
              'def test_v16_runs_only_v16_to_v17',
              'def test_v16_runs_full_v16_to_v19_chain',
          ).replace(
              'def test_v16_runs_v16_to_v17_and_v17_to_v18',
              'def test_v16_runs_full_v16_to_v19_chain',
          )
          Path('tests/test_sts_schema_upgrade.py').write_text(migration_tests, encoding='utf-8')

          gate_tests = resolve_conflicts(
              'tests/test_sts_schema_upgrade_gate.py', migration_test_handler
          )
          Path('tests/test_sts_schema_upgrade_gate.py').write_text(gate_tests, encoding='utf-8')

          agenda_schema = Path('tests/test_agenda_schema_v18_integration.py')
          agenda_text = agenda_schema.read_text(encoding='utf-8')
          agenda_text = agenda_text.replace(
              'def test_real_v17_without_agenda_state_upgrades_to_v18',
              'def test_real_v18_without_agenda_state_upgrades_to_v19',
          ).replace(
              "conn.execute(\"UPDATE meta SET value='17' WHERE key='schema_version'\")",
              "conn.execute(\"UPDATE meta SET value='18' WHERE key='schema_version'\")",
          ).replace(
              '("v17_to_v18_staff_agenda_state",)',
              '("v18_to_v19_staff_agenda_state",)',
          ).replace(
              'CURRENT_SCHEMA_VERSION == 18',
              'CURRENT_SCHEMA_VERSION == 19',
          ).replace(
              'validate_versioned_schema_fingerprint(path, 18)',
              'validate_versioned_schema_fingerprint(path, 19)',
          )
          agenda_schema.write_text(agenda_text, encoding='utf-8')
          agenda_schema.rename('tests/test_agenda_schema_v19_integration.py')

          smoke = Path('tests/smoke_sts_agenda_schema.py')
          smoke_text = smoke.read_text(encoding='utf-8').replace(
              'CURRENT_SCHEMA_VERSION == 18', 'CURRENT_SCHEMA_VERSION == 19'
          ).replace(
              'schema_version_after_second_init == "18"',
              'schema_version_after_second_init == "19"',
          ).replace(
              'print("schema_version=18")',
              'print("schema_version=19")',
          )
          smoke.write_text(smoke_text, encoding='utf-8')

          stale_patterns = (
              'v17_to_v18_staff_agenda_state',
              'CURRENT_SCHEMA_VERSION == 18',
              'schema_version_after_second_init == "18"',
              'schema_version=18',
          )
          stale_hits = []
          for path in Path('tests').rglob('*.py'):
              text = path.read_text(encoding='utf-8')
              for pattern in stale_patterns:
                  if pattern in text:
                      stale_hits.append(f'{path}:{pattern}')
          if stale_hits:
              raise RuntimeError('Stale Agenda v18 expectations:\n' + '\n'.join(stale_hits))
          PY

          git add -A
          UNMERGED="$(git diff --name-only --diff-filter=U)"
          test -z "$UNMERGED"
          git diff --cached --check
          git status --short

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-qt

      - name: Compile integrated source
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src tests

      - name: Run schema and Agenda integration gates
        shell: bash
        run: |
          set -euo pipefail
          export QT_QPA_PLATFORM=offscreen
          python -m pytest -q \
            tests/test_sts_schema_upgrade.py \
            tests/test_sts_schema_upgrade_gate.py \
            tests/test_agenda_schema_v19_integration.py \
            tests/test_agenda_startup_upgrade_integration.py \
            tests/test_sts_database_transactions.py \
            2>&1 | tee targeted-pytest.txt
          python tests/smoke_sts_agenda_schema.py 2>&1 | tee agenda-smoke.txt
          python tests/smoke_sts_database.py 2>&1 | tee -a agenda-smoke.txt

      - name: Run full regression suite
        shell: bash
        run: |
          set -euo pipefail
          export QT_QPA_PLATFORM=offscreen
          python -m pytest -q 2>&1 | tee full-pytest.txt

      - name: Commit validated integration and remove temporary probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/agenda
          {
            echo '# Gündemim Post-Activity Controlled Integration'
            echo
            echo '- source_branch: `'$SOURCE_BRANCH'`'
            echo '- source_head: `'$SOURCE_HEAD'`'
            echo '- target_branch: `'$TARGET_BRANCH'`'
            echo '- target_premerge_head: `'$TARGET_PREMERGE_HEAD'`'
            echo '- required_main_ancestor: `'$REQUIRED_MAIN_ANCESTOR'`'
            echo '- schema_chain: `v17 → v18 Activity History → v19 Gündemim Agenda`'
            echo '- compile: `PASS`'
            echo '- targeted_schema_agenda_tests: `PASS`'
            echo '- agenda_smokes: `PASS`'
            echo '- full_pytest: `PASS`'
            echo '- main_modified: `NO`'
            echo
            echo '## Full pytest tail'
            echo '```text'
            tail -n 20 full-pytest.txt
            echo '```'
          } > docs/agenda/AGENDA_POST_ACTIVITY_INTEGRATION.md

          rm -f docs/agenda/GUNDEMIM_POST_ACTIVITY_MERGE_PROBE.md
          rm -f .github/workflows/gundemim-post-activity-integration.yml
          git add -A
          git diff --cached --check
          git commit -m 'Merge Gündemim Agenda after Activity History with schema v19'
          INTEGRATION_HEAD="$(git rev-parse HEAD)"
          echo "INTEGRATION_HEAD=$INTEGRATION_HEAD" >> "$GITHUB_ENV"
          git push origin HEAD:"$TARGET_BRANCH"

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gundemim-post-activity-integration-evidence
          path: |
            targeted-pytest.txt
            agenda-smoke.txt
            full-pytest.txt
            docs/agenda/AGENDA_POST_ACTIVITY_INTEGRATION.md
          if-no-files-found: warn
