name: Gündemim Post-Activity Controlled Integration

on:
  push:
    branches:
      - integration/gundemim-after-activity-20260714
    paths:
      - .github/workflows/gundemim-post-activity-integration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-validate:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SOURCE_BRANCH: integration/gundemim-current-main-20260713
      TARGET_BRANCH: integration/gundemim-after-activity-20260714
      EXPECTED_SOURCE_HEAD: 66681d51877ad09db7379b6bbd7049a7436af1fc
      REQUIRED_MAIN_ANCESTOR: 9ec9bded1a51fd6d4cf94e9f20f36134a709aebe
    steps:
      - name: Checkout exact target branch
        uses: actions/checkout@v4
        with:
          ref: integration/gundemim-after-activity-20260714
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve Activity plus Agenda schema v19 merge
        id: resolve
        shell: bash
        run: |
          exec > >(tee "$RUNNER_TEMP/resolve.log") 2>&1
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin "$SOURCE_BRANCH" "$TARGET_BRANCH"

          BASE_HEAD="$(git rev-parse HEAD)"
          SOURCE_HEAD="$(git rev-parse "origin/$SOURCE_BRANCH")"
          echo "BASE_HEAD=$BASE_HEAD" >> "$GITHUB_ENV"
          echo "SOURCE_HEAD=$SOURCE_HEAD" >> "$GITHUB_ENV"

          test "$SOURCE_HEAD" = "$EXPECTED_SOURCE_HEAD"
          git merge-base --is-ancestor "$REQUIRED_MAIN_ANCESTOR" HEAD

          set +e
          git merge --no-commit --no-ff "origin/$SOURCE_BRANCH"
          MERGE_EXIT=$?
          set -e
          test "$MERGE_EXIT" -eq 1

          python - <<'PY'
          from pathlib import Path

          paths = (
              Path('tests/test_activity_history_main_integration.py'),
              Path('tests/test_activity_history_operations.py'),
              Path('tests/test_activity_history_query.py'),
          )
          for path in paths:
              text = path.read_text(encoding='utf-8')
              text = text.replace('CURRENT_SCHEMA_VERSION == 18', 'CURRENT_SCHEMA_VERSION == 19')
              text = text.replace('read_sts_schema_version(store.path) == 18', 'read_sts_schema_version(store.path) == 19')
              text = text.replace('schema_version_remains_18', 'schema_version_remains_19')
              path.write_text(text, encoding='utf-8')
          PY

          python tools/validation/gundemim_post_activity_resolve.py
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check -- src tests
          git status --short

      - name: Install test dependencies
        id: install
        shell: bash
        run: |
          exec > >(tee "$RUNNER_TEMP/install.log") 2>&1
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-qt

      - name: Compile integrated source
        id: compile
        shell: bash
        run: |
          exec > >(tee "$RUNNER_TEMP/compile.log") 2>&1
          set -euo pipefail
          python -m compileall -q src tests

      - name: Run schema Agenda and Activity targeted gates
        id: targeted
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          exec > >(tee "$RUNNER_TEMP/targeted.log") 2>&1
          set -euo pipefail
          python -m pytest -q \
            tests/test_sts_schema_upgrade.py \
            tests/test_sts_schema_upgrade_gate.py \
            tests/test_agenda_schema_v19_integration.py \
            tests/test_agenda_startup_upgrade_integration.py \
            tests/test_sts_database_transactions.py \
            tests/test_activity_history_main_integration.py \
            tests/test_activity_history_operations.py \
            tests/test_activity_history_query.py \
            tests/test_*agenda*.py
          python tests/smoke_sts_agenda_schema.py
          python tests/smoke_sts_database.py

      - name: Run full regression suite
        id: full
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          exec > >(tee "$RUNNER_TEMP/full.log") 2>&1
          set -euo pipefail
          python -m pytest -q

      - name: Commit validated merge and clean temporary integration files
        id: finalize
        shell: bash
        run: |
          exec > >(tee "$RUNNER_TEMP/finalize.log") 2>&1
          set -euo pipefail
          mkdir -p docs/agenda
          {
            echo '# Gündemim Post-Activity Controlled Integration'
            echo
            echo '- source_branch: `'$SOURCE_BRANCH'`'
            echo '- source_head: `'$SOURCE_HEAD'`'
            echo '- target_branch: `'$TARGET_BRANCH'`'
            echo '- target_premerge_head: `'$BASE_HEAD'`'
            echo '- required_main_ancestor: `'$REQUIRED_MAIN_ANCESTOR'`'
            echo '- schema_chain: `v17 → v18 Activity History → v19 Gündemim Agenda`'
            echo '- conflict_resolution: `PASS`'
            echo '- compile: `PASS`'
            echo '- targeted_schema_agenda_activity: `PASS`'
            echo '- agenda_database_smokes: `PASS`'
            echo '- full_pytest: `PASS`'
            echo '- main_modified: `NO`'
            echo
            echo '## Targeted test tail'
            echo '```text'
            tail -n 20 "$RUNNER_TEMP/targeted.log"
            echo '```'
            echo
            echo '## Full pytest tail'
            echo '```text'
            tail -n 20 "$RUNNER_TEMP/full.log"
            echo '```'
          } > docs/agenda/AGENDA_POST_ACTIVITY_INTEGRATION.md

          rm -f docs/agenda/AGENDA_POST_ACTIVITY_INTEGRATION_FAILURE.md
          rm -f docs/agenda/GUNDEMIM_POST_ACTIVITY_MERGE_PROBE.md
          rm -f docs/agenda/GUNDEMIM_POST_ACTIVITY_DIAGNOSTIC.md
          rm -f docs/agenda/GUNDEMIM_GATE_TEST_CONFLICT.md
          rm -f .github/workflows/gundemim-post-activity-integration.yml
          rm -f .github/workflows/gundemim-post-activity-diagnostic.yml
          rm -f .github/workflows/dispatch-gundemim-post-activity-diagnostic.yml
          rm -f .github/workflows/probe-gundemim-gate-test-conflict.yml
          rm -f tools/validation/gundemim_post_activity_resolve.py
          printf '*.ico diff\n' > .gitattributes

          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check -- src tests
          git commit -m 'Merge Gündemim Agenda after Activity History with schema v19'
          set -- $(git rev-list --parents -n 1 HEAD)
          test "$#" -eq 3
          INTEGRATION_HEAD="$(git rev-parse HEAD)"
          echo "INTEGRATION_HEAD=$INTEGRATION_HEAD" >> "$GITHUB_ENV"
          git push origin HEAD:"$TARGET_BRANCH"

      - name: Persist guarded failure report
        if: failure()
        shell: bash
        env:
          RESOLVE_OUTCOME: ${{ steps.resolve.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          TARGETED_OUTCOME: ${{ steps.targeted.outcome }}
          FULL_OUTCOME: ${{ steps.full.outcome }}
          FINALIZE_OUTCOME: ${{ steps.finalize.outcome }}
        run: |
          set -euo pipefail
          SAFE_BASE="${BASE_HEAD:-$(git rev-parse HEAD)}"
          SAFE_SOURCE="${SOURCE_HEAD:-unknown}"
          {
            echo '# Gündemim Post-Activity Integration Failure'
            echo
            echo '- target_base_head: `'$SAFE_BASE'`'
            echo '- source_head: `'$SAFE_SOURCE'`'
            echo '- resolve: `'$RESOLVE_OUTCOME'`'
            echo '- install: `'$INSTALL_OUTCOME'`'
            echo '- compile: `'$COMPILE_OUTCOME'`'
            echo '- targeted: `'$TARGETED_OUTCOME'`'
            echo '- full: `'$FULL_OUTCOME'`'
            echo '- finalize: `'$FINALIZE_OUTCOME'`'
            for name in resolve install compile targeted full finalize; do
              echo
              echo '## '"$name"' log tail'
              echo '```text'
              tail -n 120 "$RUNNER_TEMP/$name.log" 2>/dev/null || echo '(no log)'
              echo '```'
            done
          } > "$RUNNER_TEMP/integration-failure.md"

          git reset --hard "$SAFE_BASE"
          git clean -fd
          mkdir -p docs/agenda
          cp "$RUNNER_TEMP/integration-failure.md" docs/agenda/AGENDA_POST_ACTIVITY_INTEGRATION_FAILURE.md
          git add docs/agenda/AGENDA_POST_ACTIVITY_INTEGRATION_FAILURE.md
          git commit -m 'docs: record failed post-activity agenda integration'
          git push origin HEAD:"$TARGET_BRANCH"

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gundemim-post-activity-integration-evidence
          path: |
            ${{ runner.temp }}/resolve.log
            ${{ runner.temp }}/install.log
            ${{ runner.temp }}/compile.log
            ${{ runner.temp }}/targeted.log
            ${{ runner.temp }}/full.log
            ${{ runner.temp }}/finalize.log
            docs/agenda/AGENDA_POST_ACTIVITY_INTEGRATION.md
            docs/agenda/AGENDA_POST_ACTIVITY_INTEGRATION_FAILURE.md
          if-no-files-found: warn
