name: Gündemim Post-Activity Merge Probe

on:
  push:
    branches:
      - integration/gundemim-after-activity-20260714
    paths:
      - .github/workflows/gundemim-post-activity-integration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/gundemim-after-activity-20260714
          fetch-depth: 0

      - name: Probe merge without changing product files
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_BRANCH='integration/gundemim-current-main-20260713'
          TARGET_BRANCH='integration/gundemim-after-activity-20260714'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin "$SOURCE_BRANCH" "$TARGET_BRANCH"

          TARGET_HEAD="$(git rev-parse HEAD)"
          SOURCE_HEAD="$(git rev-parse "origin/$SOURCE_BRANCH")"
          MERGE_BASE="$(git merge-base HEAD "origin/$SOURCE_BRANCH")"

          set +e
          git merge --no-commit --no-ff "origin/$SOURCE_BRANCH"
          MERGE_EXIT=$?
          set -e

          {
            echo '# Gündemim Post-Activity Merge Probe'
            echo
            echo '- target_branch: `'$TARGET_BRANCH'`'
            echo '- target_head: `'$TARGET_HEAD'`'
            echo '- source_branch: `'$SOURCE_BRANCH'`'
            echo '- source_head: `'$SOURCE_HEAD'`'
            echo '- merge_base: `'$MERGE_BASE'`'
            echo '- merge_exit: `'$MERGE_EXIT'`'
            echo
            echo '## Unmerged paths'
            echo '```text'
            git diff --name-only --diff-filter=U || true
            echo '```'
            echo
            echo '## Merge status'
            echo '```text'
            git status --short
            echo '```'
          } > merge-probe.md

          python - <<'PY' >> merge-probe.md
          from pathlib import Path

          paths = [
              Path('src/services/sts_database.py'),
              Path('src/services/sts_schema_upgrade.py'),
              Path('src/services/sts_schema_upgrade_gate.py'),
              Path('tests/test_sts_schema_upgrade.py'),
              Path('tests/test_sts_schema_upgrade_gate.py'),
          ]

          print('\n## Conflict regions')
          for path in paths:
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines()
              regions = []
              index = 0
              while index < len(lines):
                  if lines[index].startswith('<<<<<<< '):
                      start = max(0, index - 8)
                      end = index
                      while end < len(lines) and not lines[end].startswith('>>>>>>> '):
                          end += 1
                      end = min(len(lines), end + 9)
                      regions.append((start, end))
                      index = end
                  else:
                      index += 1
              print(f'\n### `{path.as_posix()}`')
              if not regions:
                  print('_No marker region found._')
                  continue
              for region_no, (start, end) in enumerate(regions, 1):
                  print(f'\nRegion {region_no}, lines {start + 1}-{end}:')
                  print('```text')
                  for line_no in range(start, end):
                      print(f'{line_no + 1:05d}: {lines[line_no]}')
                  print('```')
          PY

          cat merge-probe.md

          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git merge --abort
          else
            git reset --hard HEAD
          fi

          mkdir -p docs/agenda
          mv merge-probe.md docs/agenda/GUNDEMIM_POST_ACTIVITY_MERGE_PROBE.md
          git add docs/agenda/GUNDEMIM_POST_ACTIVITY_MERGE_PROBE.md
          git commit -m 'docs: record detailed post-activity agenda merge probe'
          git push origin HEAD:"$TARGET_BRANCH"

      - name: Upload merge probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gundemim-post-activity-merge-probe
          path: docs/agenda/GUNDEMIM_POST_ACTIVITY_MERGE_PROBE.md
          if-no-files-found: error
