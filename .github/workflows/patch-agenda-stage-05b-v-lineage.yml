name: Patch Agenda Stage 5B-V Lineage Guard

on:
  push:
    branches:
      - integration/gundemim-after-activity-20260714
    paths:
      - .github/workflows/patch-agenda-stage-05b-v-lineage.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/gundemim-after-activity-20260714
          fetch-depth: 0

      - name: Patch exact lineage contract and retrigger validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          validator = Path('tools/validation/agenda_stage_05b_v_runtime_validation.py')
          text = validator.read_text(encoding='utf-8')
          old = '''        parents = _run("git", "rev-list", "--parents", "-n", "1", candidate_sha, cwd=candidate_root).split()
        run.require(len(parents) == 3, f"candidate is not a two-parent merge commit: {parents}")
        run.require(baseline_sha in parents[1:], "current main is not a direct merge parent")
        return f"parents={parents[1:]}"
'''
          new = '''        parents = _run("git", "rev-list", "--parents", "-n", "1", candidate_sha, cwd=candidate_root).split()
        run.require(len(parents) == 3, f"candidate is not a two-parent merge commit: {parents}")
        parent_shas = parents[1:]
        agenda_source_sha = "66681d51877ad09db7379b6bbd7049a7436af1fc"
        run.require(agenda_source_sha in parent_shas, f"Agenda source is not a direct merge parent: {parent_shas}")
        target_parent = next(parent for parent in parent_shas if parent != agenda_source_sha)
        target_lineage = subprocess.run(
            ["git", "merge-base", "--is-ancestor", baseline_sha, target_parent],
            cwd=candidate_root,
            check=False,
        )
        run.require(target_lineage.returncode == 0, "current main is not an ancestor of target merge parent")
        return f"target_parent={target_parent}; agenda_source_parent={agenda_source_sha}"
'''
          if old not in text:
              raise SystemExit('expected lineage block not found')
          validator.write_text(text.replace(old, new, 1), encoding='utf-8')

          workflow = Path('.github/workflows/agenda-stage-05b-v-runtime-validation.yml')
          workflow.write_text(
              workflow.read_text(encoding='utf-8') + '\n# rerun: corrected merge lineage contract\n',
              encoding='utf-8',
          )
          PY

          rm -f .github/workflows/patch-agenda-stage-05b-v-lineage.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: validate post-Activity Agenda merge lineage correctly'
          git push origin HEAD:integration/gundemim-after-activity-20260714
