name: Dispatch Gündemim Post-Activity Integration

on:
  push:
    branches:
      - integration/gundemim-after-activity-20260714
    paths:
      - .github/workflows/dispatch-gundemim-post-activity-diagnostic.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch controlled integration workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run gundemim-post-activity-integration.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}"
