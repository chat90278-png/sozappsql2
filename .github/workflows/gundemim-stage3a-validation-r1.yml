name: Gundemim Stage 3A Qt Visual Validation R1

on:
  pull_request:
    types:
      - opened
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-stage3a-r1:
    if: github.head_ref == 'feature/gundemim-agenda-system'
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Prepare exact feature source
        shell: pwsh
        run: |
          $feature = "${{ github.event.pull_request.head.sha }}"
          Write-Host "GUNDEMIM_STAGE3A_R1_WORKFLOW_FEATURE_SHA=$feature"

          git init -q .
          git remote add origin https://github.com/chat90278-png/sozappsql2.git
          git -c protocol.version=2 fetch --quiet --depth=1 origin $feature
          git checkout --quiet FETCH_HEAD

          $actual = git rev-parse HEAD
          Write-Host "GUNDEMIM_STAGE3A_R1_WORKFLOW_ACTUAL_SHA=$actual"
          if ($actual -ne $feature) {
            throw "Stage 3A R1 feature checkout SHA mismatch."
          }
          if (-not (Test-Path requirements.txt)) {
            throw "requirements.txt is missing."
          }
          if (-not (Test-Path .github/validation/gundemim_stage3a_gate_r1.py)) {
            throw "Stage 3A R1 validation script is missing."
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --quiet --disable-pip-version-check -r requirements.txt
          if ($LASTEXITCODE -ne 0) {
            throw "requirements installation failed."
          }
          python -m pip install --quiet --disable-pip-version-check pytest
          if ($LASTEXITCODE -ne 0) {
            throw "pytest installation failed."
          }
          python -c "import PySide6; print('PYSIDE6_IMPORT=PASS', PySide6.__version__)"
          if ($LASTEXITCODE -ne 0) {
            throw "PySide6 import proof failed."
          }

      - name: Run Stage 3A visual bootstrap retry gate
        shell: pwsh
        run: |
          python .github/validation/gundemim_stage3a_gate_r1.py --baseline-sha 0088006620c25a2508cbc3b7885d173bb5662292 --feature-sha "${{ github.event.pull_request.head.sha }}" --repo-url https://github.com/chat90278-png/sozappsql2.git

      - name: Upload validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gundemim-stage3a-runtime-visual-validation-r1
          path: |
            validation-out/*.json
            validation-out/*.xml
            validation-out/*.txt
            validation-out/visual/*.json
            validation-out/visual/*.txt
            validation-out/visual/*.png
          if-no-files-found: warn
          retention-days: 7
