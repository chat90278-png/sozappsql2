name: Fix 42 Baseline Failures Validation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'fix/close-baseline-42-tests'
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PYTHONPATH: .

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.2

      - name: Determine validation scope
        id: scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin main --depth=1
          $changed = @(git diff --name-only origin/main...HEAD)
          $changed | Out-File -Encoding utf8 changed-paths.txt
          $productChanges = @($changed | Where-Object { $_ -ne '.github/workflows/fix42-validation.yml' })
          $baseline = ($productChanges.Count -eq 0)
          $step1 = $changed -contains 'tests/test_share_merge_window_orchestration.py'
          $step2 = $changed -contains 'tests/test_share_merge_dialog.py'
          $analysisFiles = @(
            'tests/test_analysis_builder_qt.py',
            'tests/test_analysis_excel_export_qt.py',
            'tests/test_analysis_qt_integration.py',
            'tests/test_analysis_tur17_builder_ux_qt.py',
            'tests/test_analysis_visual_settings_qt.py',
            'tests/conftest.py'
          )
          $step3 = @($changed | Where-Object { $analysisFiles -contains $_ }).Count -gt 0
          $step4 = ($changed -contains 'src/ui/widgets/contract_status_summary.py') -or ($changed -contains 'tests/test_contract_status_summary_widget.py')
          "baseline=$($baseline.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "step1=$($step1.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "step2=$($step2.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "step3=$($step3.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "step4=$($step4.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Compile
        shell: pwsh
        run: python -m compileall -q app.py src analysis_center tests

      - name: Run full pytest baseline or final
        if: steps.scope.outputs.baseline == 'true' || steps.scope.outputs.step4 == 'true'
        id: full
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          python -m pytest -q --junitxml=evidence/full.xml
          $code = $LASTEXITCODE
          "$code" | Out-File -Encoding ascii evidence/full.exitcode
          "exit_code=$code" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Summarize full pytest JUnit
        if: steps.scope.outputs.baseline == 'true' || steps.scope.outputs.step4 == 'true'
        shell: pwsh
        run: |
          @'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path('evidence/full.xml')
          root = ET.parse(path).getroot()
          suites = [root] if root.tag == 'testsuite' else list(root.iter('testsuite'))
          tests = sum(int(s.attrib.get('tests', 0)) for s in suites if s is not root or root.tag == 'testsuite')
          failures = sum(int(s.attrib.get('failures', 0)) for s in suites if s is not root or root.tag == 'testsuite')
          errors = sum(int(s.attrib.get('errors', 0)) for s in suites if s is not root or root.tag == 'testsuite')
          skipped = sum(int(s.attrib.get('skipped', 0)) for s in suites if s is not root or root.tag == 'testsuite')
          if root.tag == 'testsuites':
              tests = int(root.attrib.get('tests', tests))
              failures = int(root.attrib.get('failures', failures))
              errors = int(root.attrib.get('errors', errors))
              skipped = int(root.attrib.get('skipped', skipped))
          nodes = []
          for case in root.iter('testcase'):
              if case.find('failure') is None and case.find('error') is None:
                  continue
              classname = case.attrib.get('classname', '')
              name = case.attrib.get('name', '')
              nodes.append(f'{classname}::{name}' if classname else name)
          summary = {
              'tests': tests,
              'failures': failures,
              'errors': errors,
              'skipped': skipped,
              'failing_nodes': sorted(nodes),
              'exit_code': int(Path('evidence/full.exitcode').read_text().strip()),
          }
          Path('evidence/full-summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          '@ | python -

      - name: Run step 1 isolated tests
        if: steps.scope.outputs.step1 == 'true'
        shell: pwsh
        run: python -m pytest -q tests/test_share_merge_window_orchestration.py --junitxml=evidence/step1.xml

      - name: Run step 2 isolated tests
        if: steps.scope.outputs.step2 == 'true'
        shell: pwsh
        run: python -m pytest -q tests/test_share_merge_dialog.py --junitxml=evidence/step2.xml

      - name: Run step 3 isolated tests
        if: steps.scope.outputs.step3 == 'true'
        shell: pwsh
        run: |
          python -m pytest -q `
            tests/test_analysis_builder_qt.py `
            tests/test_analysis_excel_export_qt.py `
            tests/test_analysis_qt_integration.py `
            tests/test_analysis_tur17_builder_ux_qt.py `
            tests/test_analysis_visual_settings_qt.py `
            --junitxml=evidence/step3.xml

      - name: Run step 4 isolated tests
        if: steps.scope.outputs.step4 == 'true'
        shell: pwsh
        run: python -m pytest -q tests/test_contract_status_summary_widget.py --junitxml=evidence/step4.xml

      - name: Enforce final full suite
        if: steps.scope.outputs.step4 == 'true'
        shell: pwsh
        run: |
          $code = [int](Get-Content evidence/full.exitcode)
          if ($code -ne 0) { throw "Final full pytest failed with exit code $code" }

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fix42-validation-${{ github.event.pull_request.head.sha }}
          path: |
            evidence
            changed-paths.txt
          if-no-files-found: warn
