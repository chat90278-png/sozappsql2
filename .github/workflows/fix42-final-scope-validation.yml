name: Fix42 Final Scope Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PYTHONPATH: "."
      ORIGINAL_ARTIFACT_ID: "8271212551"
      ORIGINAL_BASELINE_SHA: "bc5feca2aa755b4e12c98b9932810778ec08d6cb"
      ORIGINAL_FEATURE_SHA: "9de74e04c33479e652b15ecff625751b8f68c46b"
      CURRENT_MAIN_BASE_SHA: "f3279e4d546dbf2e22963298ebc90f4eaaea9494"
      FIX_FILES_BASE_SHA: "85be5d4976db9ca9334cc85653e6306c6244ef2c"
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.2

      - name: Assert previously validated nine files are untouched
        shell: pwsh
        run: |
          $files = @(
            "tests/test_share_merge_window_orchestration.py",
            "tests/test_share_merge_dialog.py",
            "tests/qt_wait_helpers.py",
            "tests/test_analysis_builder_qt.py",
            "tests/test_analysis_excel_export_qt.py",
            "tests/test_analysis_qt_integration.py",
            "tests/test_analysis_tur17_builder_ux_qt.py",
            "tests/test_analysis_visual_settings_qt.py",
            "src/ui/widgets/contract_status_summary.py"
          )
          git diff --exit-code $env:FIX_FILES_BASE_SHA HEAD -- $files
          if ($LASTEXITCODE -ne 0) { throw "One or more validated fix files changed" }

      - name: Validate fail-loud JUnit parser modes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force _validation/selftest | Out-Null
          @'
          <testsuite name="single" tests="1" failures="0" errors="0" skipped="0">
            <testcase classname="selftest" name="pass" />
          </testsuite>
          '@ | Set-Content -Encoding utf8 _validation/selftest/single.xml
          python tools/validation/junit_summary.py _validation/selftest/single.xml _validation/selftest/single.json --exit-code 0 --expect-tests 1 --expect-failures 0 --expect-errors 0 --expect-skipped 0

          @'
          <testsuites>
            <testsuite name="outer">
              <testsuite name="first" tests="1" failures="0" errors="0" skipped="0">
                <testcase classname="selftest" name="first" />
              </testsuite>
              <testsuite name="second" tests="1" failures="1" errors="0" skipped="0">
                <testcase classname="selftest" name="second"><failure message="expected" /></testcase>
              </testsuite>
            </testsuite>
          </testsuites>
          '@ | Set-Content -Encoding utf8 _validation/selftest/nested.xml
          python tools/validation/junit_summary.py _validation/selftest/nested.xml _validation/selftest/nested.json --exit-code 1 --expect-tests 2 --expect-failures 1 --expect-errors 0 --expect-skipped 0

          @'
          <testsuites><testsuite name="empty" tests="0" failures="0" errors="0" skipped="0" /></testsuites>
          '@ | Set-Content -Encoding utf8 _validation/selftest/zero.xml
          python tools/validation/junit_summary.py _validation/selftest/zero.xml _validation/selftest/zero.json --exit-code 0
          if ($LASTEXITCODE -eq 0) { throw "Zero-test JUnit unexpectedly produced a passing summary" }
          if (Test-Path _validation/selftest/zero.json) { throw "Fail-loud parser left a stale zero-test summary" }

      - name: Regenerate step and current-full summaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force _validation/fix42-final | Out-Null

          function Invoke-TestAndSummary {
            param(
              [string]$Name,
              [int]$ExpectedTests,
              [string[]]$Paths
            )
            $xml = "_validation/fix42-final/$Name.xml"
            $json = "_validation/fix42-final/$Name-summary.json"
            $arguments = @("-m", "pytest", "-q") + $Paths + @("--junitxml=$xml")
            & python @arguments
            $testCode = $LASTEXITCODE
            python tools/validation/junit_summary.py $xml $json --exit-code $testCode --expect-tests $ExpectedTests --expect-failures 0 --expect-errors 0 --expect-skipped 0
            if ($LASTEXITCODE -ne 0) { throw "$Name summary validation failed" }
            if ($testCode -ne 0) { throw "$Name pytest failed with exit code $testCode" }
          }

          Invoke-TestAndSummary "step1" 8 @("tests/test_share_merge_window_orchestration.py")
          Invoke-TestAndSummary "step2" 6 @("tests/test_share_merge_dialog.py")
          Invoke-TestAndSummary "step3" 32 @(
            "tests/test_analysis_builder_qt.py",
            "tests/test_analysis_excel_export_qt.py",
            "tests/test_analysis_qt_integration.py",
            "tests/test_analysis_tur17_builder_ux_qt.py",
            "tests/test_analysis_visual_settings_qt.py"
          )
          Invoke-TestAndSummary "step4" 3 @("tests/test_contract_status_summary_widget.py")
          Invoke-TestAndSummary "final-full" 721 @()

      - name: Download original Agenda validation evidence
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force _validation/original-agenda | Out-Null
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $uri = "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$env:ORIGINAL_ARTIFACT_ID/zip"
          Invoke-WebRequest -Headers $headers -Uri $uri -OutFile _validation/original-agenda.zip -MaximumRedirection 10
          Expand-Archive -Path _validation/original-agenda.zip -DestinationPath _validation/original-agenda -Force
          if (-not (Test-Path _validation/original-agenda/baseline-full.xml)) { throw "Original baseline XML missing" }
          if (-not (Test-Path _validation/original-agenda/feature-full.xml)) { throw "Original feature XML missing" }

      - name: Analyze exact collection scope discrepancy
        shell: pwsh
        run: |
          @'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path.cwd()
          evidence = root / "_validation" / "fix42-final"
          original = root / "_validation" / "original-agenda"
          baseline_sha = "bc5feca2aa755b4e12c98b9932810778ec08d6cb"
          current_sha = "f3279e4d546dbf2e22963298ebc90f4eaaea9494"
          feature_sha = "9de74e04c33479e652b15ecff625751b8f68c46b"

          def nodes(path: Path) -> list[str]:
              parsed = ET.parse(path).getroot()
              result = []
              for case in parsed.iter("testcase"):
                  classname = case.attrib.get("classname", "").strip()
                  name = case.attrib.get("name", "").strip()
                  result.append(f"{classname}::{name}" if classname else name)
              return sorted(result)

          old_baseline = set(nodes(original / "baseline-full.xml"))
          old_feature = set(nodes(original / "feature-full.xml"))
          current = set(nodes(evidence / "final-full.xml"))
          baseline_only = sorted(old_baseline - current)
          current_only = sorted(current - old_baseline)
          feature_only_current = sorted(old_feature - current)

          (evidence / "baseline923-only-vs-current721.txt").write_text("\n".join(baseline_only) + "\n", encoding="utf-8")
          (evidence / "current721-only-vs-baseline923.txt").write_text("\n".join(current_only) + "\n", encoding="utf-8")
          (evidence / "feature982-only-vs-current721.txt").write_text("\n".join(feature_only_current) + "\n", encoding="utf-8")

          candidates = ["pytest.ini", "pyproject.toml", "setup.cfg", "tox.ini", "conftest.py", "tests/conftest.py"]
          def config_snapshot(ref: str) -> dict[str, object]:
              result: dict[str, object] = {}
              for path in candidates:
                  completed = subprocess.run(["git", "show", f"{ref}:{path}"], capture_output=True)
                  if completed.returncode == 0:
                      result[path] = {
                          "present": True,
                          "sha256": hashlib.sha256(completed.stdout).hexdigest(),
                          "bytes": len(completed.stdout),
                      }
                  else:
                      result[path] = {"present": False}
              return result

          merge_base = subprocess.check_output(["git", "merge-base", baseline_sha, current_sha], text=True).strip()
          divergence = subprocess.check_output(["git", "rev-list", "--left-right", "--count", f"{baseline_sha}...{current_sha}"], text=True).strip().split()
          report = {
              "commands": {
                  "original_baseline": "python -m pytest -q --junitxml=<evidence>/baseline-full.xml",
                  "original_feature": "python -m pytest -q --junitxml=<evidence>/feature-full.xml",
                  "current_fix": "python -m pytest -q --junitxml=<evidence>/final-full.xml",
                  "filters_or_ignores": [],
              },
              "refs": {
                  "original_baseline": baseline_sha,
                  "original_feature": feature_sha,
                  "current_main_base": current_sha,
                  "merge_base_original_baseline_vs_current_main": merge_base,
                  "original_baseline_only_commits": int(divergence[0]),
                  "current_main_only_commits": int(divergence[1]),
              },
              "collection": {
                  "original_baseline": len(old_baseline),
                  "original_feature": len(old_feature),
                  "current_fix": len(current),
                  "baseline923_only_count": len(baseline_only),
                  "current721_only_count": len(current_only),
                  "net_count_difference": len(old_baseline) - len(current),
                  "feature982_only_vs_current_count": len(feature_only_current),
              },
              "pytest_configuration": {
                  "original_baseline": config_snapshot(baseline_sha),
                  "current_main": config_snapshot(current_sha),
                  "original_feature": config_snapshot(feature_sha),
              },
              "root_cause": (
                  "The 923-run ref and the 721-run ref are divergent source trees, not the same tree under different pytest filters. "
                  "The exact node-set delta is 263 nodes present only in the Stage-3B/Agenda lineage and 61 nodes present only in later main, "
                  "which yields the net total difference of 202. Therefore there is no truthful standalone list of exactly 202 missing node IDs."
              ),
              "intentional_or_bug": "bug",
              "resolution": "Validate the nine fixes on the exact 982-test Agenda feature ref instead of treating later main's 721 collection as equivalent scope.",
          }
          if report["collection"] != {
              "original_baseline": 923,
              "original_feature": 982,
              "current_fix": 721,
              "baseline923_only_count": 263,
              "current721_only_count": 61,
              "net_count_difference": 202,
              "feature982_only_vs_current_count": 322,
          }:
              raise SystemExit(f"unexpected collection delta: {report['collection']}")
          (evidence / "scope-discrepancy.json").write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          '@ | python -

      - name: Apply only the nine validated fixes to exact 982-test Agenda ref
        shell: pwsh
        run: |
          $featureDir = Join-Path $env:RUNNER_TEMP "agenda-feature-full-scope"
          $patchPath = Join-Path $env:RUNNER_TEMP "fix42-nine-files.patch"
          $files = @(
            "tests/test_share_merge_window_orchestration.py",
            "tests/test_share_merge_dialog.py",
            "tests/qt_wait_helpers.py",
            "tests/test_analysis_builder_qt.py",
            "tests/test_analysis_excel_export_qt.py",
            "tests/test_analysis_qt_integration.py",
            "tests/test_analysis_tur17_builder_ux_qt.py",
            "tests/test_analysis_visual_settings_qt.py",
            "src/ui/widgets/contract_status_summary.py"
          )
          if (Test-Path $featureDir) { Remove-Item -Recurse -Force $featureDir }
          git worktree add --detach $featureDir $env:ORIGINAL_FEATURE_SHA
          if ($LASTEXITCODE -ne 0) { throw "Unable to materialize Agenda feature ref" }

          @'
          import pathlib
          import subprocess
          import sys
          base = sys.argv[1]
          head = sys.argv[2]
          output = pathlib.Path(sys.argv[3])
          files = sys.argv[4:]
          output.write_bytes(subprocess.check_output(["git", "diff", "--binary", base, head, "--", *files]))
          '@ | python - $env:CURRENT_MAIN_BASE_SHA HEAD $patchPath @files

          git -C $featureDir apply --3way $patchPath
          if ($LASTEXITCODE -ne 0) { throw "The nine-file fix patch did not apply cleanly to the Agenda feature ref" }
          git -C $featureDir diff --check
          if ($LASTEXITCODE -ne 0) { throw "Applied patch has whitespace errors" }

          $changed = @(git -C $featureDir diff --name-only)
          $expected = @($files | Sort-Object)
          $actual = @($changed | Sort-Object)
          if (($expected -join "`n") -ne ($actual -join "`n")) {
            throw "Unexpected full-scope changed paths. Expected: $($expected -join ', '); actual: $($actual -join ', ')"
          }

          New-Item -ItemType Directory -Force (Join-Path $featureDir "tools/validation") | Out-Null
          Copy-Item tools/validation/junit_summary.py (Join-Path $featureDir "tools/validation/junit_summary.py") -Force
          @{
            feature_ref = $env:ORIGINAL_FEATURE_SHA
            fix_head = "${{ github.sha }}"
            patch_base = $env:CURRENT_MAIN_BASE_SHA
            changed_paths = $actual
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 _validation/fix42-final/full-scope-materialization.json

      - name: Run exact full Agenda collection with fixes
        shell: pwsh
        run: |
          $featureDir = Join-Path $env:RUNNER_TEMP "agenda-feature-full-scope"
          Push-Location $featureDir
          try {
            python -m pip install -r requirements.txt
            python -m compileall -q src tests
            if ($LASTEXITCODE -ne 0) { throw "Full-scope compile failed" }
            python -m pytest -q --junitxml=full-scope-final.xml
            $testCode = $LASTEXITCODE
            python tools/validation/junit_summary.py full-scope-final.xml full-scope-final-summary.json --exit-code $testCode --expect-tests 982 --expect-failures 0 --expect-errors 0 --expect-skipped 0
            if ($LASTEXITCODE -ne 0) { throw "Full-scope summary validation failed" }
            if ($testCode -ne 0) { throw "Full-scope pytest failed with exit code $testCode" }
            Copy-Item full-scope-final.xml $env:GITHUB_WORKSPACE/_validation/fix42-final/full-scope-final.xml -Force
            Copy-Item full-scope-final-summary.json $env:GITHUB_WORKSPACE/_validation/fix42-final/full-scope-final-summary.json -Force
          } finally {
            Pop-Location
          }

      - name: Build differential final report
        shell: pwsh
        run: |
          @'
          from __future__ import annotations

          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path("_validation/fix42-final")
          original = Path("_validation/original-agenda")

          def failed_nodes(path: Path) -> set[str]:
              parsed = ET.parse(path).getroot()
              result = set()
              for case in parsed.iter("testcase"):
                  if case.find("failure") is None and case.find("error") is None:
                      continue
                  classname = case.attrib.get("classname", "").strip()
                  name = case.attrib.get("name", "").strip()
                  result.add(f"{classname}::{name}" if classname else name)
              return result

          original_failures = failed_nodes(original / "feature-full.xml")
          final_summary = json.loads((root / "full-scope-final-summary.json").read_text(encoding="utf-8-sig"))
          final_failures = set(final_summary["failing_nodes"])
          new_failures = sorted(final_failures - original_failures)
          fixed_nodes = sorted(original_failures - final_failures)
          report = {
              "full_scope_final_run": final_summary,
              "original_feature_failure_count": len(original_failures),
              "new_failures_vs_original_baseline": new_failures,
              "fixed_nodes": fixed_nodes,
              "ready_to_merge": (
                  final_summary["tests"] == 982
                  and final_summary["failures"] == 0
                  and final_summary["errors"] == 0
                  and not new_failures
              ),
          }
          if len(original_failures) != 42:
              raise SystemExit(f"expected 42 original failures, got {len(original_failures)}")
          if len(fixed_nodes) != 42 or new_failures:
              raise SystemExit(f"unexpected differential: fixed={len(fixed_nodes)}, new={new_failures}")
          if not report["ready_to_merge"]:
              raise SystemExit("full-scope final validation is not merge-ready")
          (root / "full-scope-differential.json").write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          '@ | python -

      - name: Reassert validated nine files remain unchanged on PR branch
        shell: pwsh
        run: |
          $files = @(
            "tests/test_share_merge_window_orchestration.py",
            "tests/test_share_merge_dialog.py",
            "tests/qt_wait_helpers.py",
            "tests/test_analysis_builder_qt.py",
            "tests/test_analysis_excel_export_qt.py",
            "tests/test_analysis_qt_integration.py",
            "tests/test_analysis_tur17_builder_ux_qt.py",
            "tests/test_analysis_visual_settings_qt.py",
            "src/ui/widgets/contract_status_summary.py"
          )
          git diff --exit-code $env:FIX_FILES_BASE_SHA HEAD -- $files
          if ($LASTEXITCODE -ne 0) { throw "Validated fix files changed during final validation" }

      - name: Upload final validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fix42-final-scope-${{ github.sha }}
          path: |
            _validation/fix42-final
            _validation/selftest
          if-no-files-found: error
          retention-days: 90
