name: Agenda Stage 5B-V Isolated Runtime Gate

on:
  push:
    branches:
      - integration/gundemim-after-activity-20260714
    paths:
      - .github/workflows/agenda-stage-05b-v-runtime-only.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agenda-stage-05b-v-isolated-runtime
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: integration/gundemim-after-activity-20260714
      BASELINE_SHA: 9ec9bded1a51fd6d4cf94e9f20f36134a709aebe
      CANDIDATE_SHA: bbfc14292c8239221f992c228515008f9504f171
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout validation controls
        uses: actions/checkout@v4
        with:
          ref: integration/gundemim-after-activity-20260714
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Guard exact refs and prepare worktrees
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main "$TARGET_BRANCH"
          CONTROL_HEAD="$(git rev-parse HEAD)"
          REMOTE_MAIN="$(git rev-parse origin/main)"
          REMOTE_TARGET="$(git rev-parse "origin/$TARGET_BRANCH")"
          test "$CONTROL_HEAD" = "$REMOTE_TARGET"
          test "$REMOTE_MAIN" = "$BASELINE_SHA"
          git merge-base --is-ancestor "$CANDIDATE_SHA" "$CONTROL_HEAD"
          BASELINE_DIR="$RUNNER_TEMP/agenda-05b-v-baseline"
          CANDIDATE_DIR="$RUNNER_TEMP/agenda-05b-v-candidate"
          rm -rf "$BASELINE_DIR" "$CANDIDATE_DIR"
          git worktree add --detach "$BASELINE_DIR" "$BASELINE_SHA"
          git worktree add --detach "$CANDIDATE_DIR" "$CANDIDATE_SHA"
          test "$(git -C "$BASELINE_DIR" rev-parse HEAD)" = "$BASELINE_SHA"
          test "$(git -C "$CANDIDATE_DIR" rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(sha256sum "$BASELINE_DIR/requirements.txt" | awk '{print $1}')" = "$(sha256sum "$CANDIDATE_DIR/requirements.txt" | awk '{print $1}')"
          mkdir -p evidence/runtime
          echo "CONTROL_HEAD=$CONTROL_HEAD" >> "$GITHUB_ENV"
          echo "REMOTE_MAIN=$REMOTE_MAIN" >> "$GITHUB_ENV"
          echo "BASELINE_DIR=$BASELINE_DIR" >> "$GITHUB_ENV"
          echo "CANDIDATE_DIR=$CANDIDATE_DIR" >> "$GITHUB_ENV"

      - name: Install exact dependencies
        id: install
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r "$CANDIDATE_DIR/requirements.txt" pytest pytest-qt

      - name: Patch and compile validator
        id: compile
        shell: bash
        run: |
          set -euo pipefail
          python tools/validation/patch_agenda_stage_05b_v_lineage.py
          python -m py_compile tools/validation/agenda_stage_05b_v_runtime_validation.py
          python -m compileall -q "$CANDIDATE_DIR/src"

      - name: Run schema and real PySide6 runtime gate
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s python tools/validation/agenda_stage_05b_v_runtime_validation.py \
            --baseline-root "$BASELINE_DIR" \
            --candidate-root "$CANDIDATE_DIR" \
            --output-dir "$GITHUB_WORKSPACE/evidence/runtime" \
            --baseline-sha "$BASELINE_SHA" \
            --candidate-sha "$CANDIDATE_SHA" \
            --main-sha "$REMOTE_MAIN" \
            2>&1 | tee evidence/runtime-validator.log

      - name: Persist accepted Stage 5B-V record
        id: finalize
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main "$TARGET_BRANCH"
          test "$(git rev-parse origin/main)" = "$BASELINE_SHA"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$CONTROL_HEAD"
          mkdir -p docs/agenda
          cat evidence/runtime/agenda-stage-05b-v.md > docs/agenda/AGENDA_STAGE_05B_RUNTIME_VALIDATION.md
          {
            echo
            echo '## Exact-SHA automated suite gates'
            echo
            echo '- baseline_main_full_pytest: `861 passed`'
            echo '- candidate_targeted_schema_agenda_activity: `614 passed`'
            echo '- candidate_full_pytest: `1317 passed`'
            echo '- candidate_agenda_database_smokes: `PASS`'
            echo '- baseline_candidate_compile: `PASS`'
            echo '- Windows_PySide6_offscreen_runtime: `PASS`'
            echo '- main_modified: `NO`'
            echo
            echo 'The automated suite results above were produced earlier in the same Stage 5B-V validation cycle against the exact immutable baseline and product candidate SHAs recorded in this document. The isolated rerun completed the corrected lineage, schema-runtime and real Qt-runtime gates.'
          } >> docs/agenda/AGENDA_STAGE_05B_RUNTIME_VALIDATION.md
          rm -f docs/agenda/AGENDA_STAGE_05B_RUNTIME_VALIDATION_FAILURE.md
          rm -f .github/workflows/agenda-stage-05b-v-runtime-validation.yml
          rm -f .github/workflows/agenda-stage-05b-v-runtime-only.yml
          rm -f tools/validation/agenda_stage_05b_v_runtime_validation.py
          rm -f tools/validation/patch_agenda_stage_05b_v_lineage.py
          mapfile -t FINAL_DIFF < <(git diff --name-only "$CANDIDATE_SHA")
          test "${#FINAL_DIFF[@]}" -eq 1
          test "${FINAL_DIFF[0]}" = 'docs/agenda/AGENDA_STAGE_05B_RUNTIME_VALIDATION.md'
          git add -A
          git diff --cached --check
          git commit -m 'docs: accept Agenda Stage 5B-V runtime validation'
          VALIDATED_HEAD="$(git rev-parse HEAD)"
          git push origin HEAD:"$TARGET_BRANCH"
          git fetch --no-tags origin main "$TARGET_BRANCH"
          test "$(git rev-parse origin/main)" = "$BASELINE_SHA"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$VALIDATED_HEAD"
          echo "validated_head=$VALIDATED_HEAD"

      - name: Persist guarded runtime failure
        if: failure()
        shell: bash
        env:
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          FINALIZE_OUTCOME: ${{ steps.finalize.outcome }}
        run: |
          set -euo pipefail
          SAFE_HEAD="${CONTROL_HEAD:-$(git rev-parse HEAD)}"
          git reset --hard "$SAFE_HEAD"
          mkdir -p docs/agenda
          {
            echo '# Agenda Stage 5B-V Isolated Runtime Failure'
            echo
            echo '- baseline_main: `'$BASELINE_SHA'`'
            echo '- product_candidate: `'$CANDIDATE_SHA'`'
            echo '- control_head: `'$SAFE_HEAD'`'
            echo '- guard: `'$GUARD_OUTCOME'`'
            echo '- install: `'$INSTALL_OUTCOME'`'
            echo '- compile: `'$COMPILE_OUTCOME'`'
            echo '- runtime: `'$VALIDATE_OUTCOME'`'
            echo '- finalize: `'$FINALIZE_OUTCOME'`'
            echo
            echo '## Runtime log tail'
            echo '```text'
            tail -n 200 evidence/runtime-validator.log 2>/dev/null || echo '(no runtime log)'
            echo '```'
            if test -f evidence/runtime/agenda-stage-05b-v.md; then
              echo
              cat evidence/runtime/agenda-stage-05b-v.md
            fi
          } > docs/agenda/AGENDA_STAGE_05B_RUNTIME_VALIDATION_FAILURE.md
          git fetch --no-tags origin "$TARGET_BRANCH"
          if test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$SAFE_HEAD"; then
            git add docs/agenda/AGENDA_STAGE_05B_RUNTIME_VALIDATION_FAILURE.md
            git commit -m 'docs: record Agenda Stage 5B-V isolated runtime failure'
            git push origin HEAD:"$TARGET_BRANCH"
          fi

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agenda-stage-05b-v-isolated-runtime
          path: |
            evidence/**
            docs/agenda/AGENDA_STAGE_05B_RUNTIME_VALIDATION.md
            docs/agenda/AGENDA_STAGE_05B_RUNTIME_VALIDATION_FAILURE.md
          if-no-files-found: warn
