name: Gündemim UI Final Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout pull request merge
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon-x11-0

      - name: Install dependencies
        run: |
          python -m pip install --quiet --disable-pip-version-check -r requirements.txt
          python -m pip install --quiet --disable-pip-version-check pytest

      - name: Compile changed UI files
        run: |
          python -m py_compile src/ui/agenda_compact_widget.py src/ui/agenda_detail_window.py

      - name: Run requested pytest command
        shell: bash
        run: |
          mkdir -p validation-out
          set +e
          python3 -m pytest tests/test_agenda_compact_widget.py tests/test_agenda_detail_window.py tests/test_main_page_agenda_integration.py tests/test_staff_agenda_service.py tests/test_agenda_presentation.py -v 2>&1 | tee validation-out/pytest-output.txt
          status=${PIPESTATUS[0]}
          echo "PYTEST_EXIT_CODE=$status" | tee validation-out/pytest-exit-code.txt
          exit "$status"

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gundemim-ui-final-validation
          path: validation-out/*
          if-no-files-found: error
          retention-days: 7
