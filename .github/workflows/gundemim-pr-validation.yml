name: Gundemim PR Runtime Validation

on:
  pull_request:
    types:
      - opened
    branches:
      - main

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONUNBUFFERED: "1"

jobs:
  validate:
    if: github.head_ref == 'feature/gundemim-agenda-system'
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact feature head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify checked out head SHA
        run: |
          $actual = git rev-parse HEAD
          $expected = "${{ github.event.pull_request.head.sha }}"
          Write-Host "checked_out_sha=$actual"
          Write-Host "expected_head_sha=$expected"
          if ($actual -ne $expected) {
            throw "Checked out SHA does not match pull request head SHA."
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile source
        run: python -m compileall -q src tests

      - name: Targeted transaction and agenda tests
        run: python -m pytest -q tests/test_sts_database_transactions.py tests/test_agenda_keys.py tests/test_agenda_deadline_stage.py tests/test_agenda_models.py tests/test_agenda_state_repository.py

      - name: Agenda schema smoke
        run: python tests/smoke_sts_agenda_schema.py

      - name: Existing STS database smoke
        run: python tests/smoke_sts_database.py

      - name: Full pytest regression
        run: python -m pytest -q
