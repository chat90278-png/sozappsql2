name: Agenda Stage 05B-V Runtime Validation

on:
  push:
    branches:
      - integration/gundemim-current-main-20260713

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: agenda-stage-05b-v-integration
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PYTHONHASHSEED: '0'
      PR_NUMBER: '334'

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/gundemim-current-main-20260713
          fetch-depth: 0

      - name: Record official run start
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 334 `
            --repo $env:GITHUB_REPOSITORY `
            --body "Stage 5B-V official run $env:GITHUB_RUN_ID started for $env:GITHUB_SHA."

      - name: Set up Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip

      - name: Install validation environment
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run Stage 5B-V differential validation
        shell: pwsh
        continue-on-error: true
        run: |
          python tools/validation/agenda_stage_05b_v_runtime_validation.py

      - name: Upload Stage 5B-V evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agenda-stage-05b-v-evidence
          path: evidence/
          retention-days: 30
          if-no-files-found: warn

      - name: Finalize branch and close temporary PR
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: |
          $decision = if (Test-Path evidence/decision.txt) {
            (Get-Content evidence/decision.txt -First 1).Trim()
          } else {
            'FAIL'
          }
          $passed = $decision -eq 'PASS'

          $jobId = (
            gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/jobs" `
              --jq '.jobs[0].id' 2>$null
          )
          $artifactSize = (
            gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:ARTIFACT_ID" `
              --jq '.size_in_bytes' 2>$null
          )
          if (-not $jobId) { $jobId = 'unknown' }
          if (-not $artifactSize) { $artifactSize = 'unknown' }
          if (-not $env:ARTIFACT_ID) { $env:ARTIFACT_ID = 'unknown' }
          if (-not $env:ARTIFACT_DIGEST) { $env:ARTIFACT_DIGEST = 'unknown' }

          if ($passed) {
            $refs = Get-Content evidence/refs.json -Raw | ConvertFrom-Json
            $req = Get-Content evidence/requirements-parity.json -Raw | ConvertFrom-Json
            $junit = Get-Content evidence/junit-differential.json -Raw | ConvertFrom-Json
            $schema = Get-Content evidence/schema-runtime.json -Raw
            $qt = Get-Content evidence/qt-runtime.json -Raw
            $environment = Get-Content evidence/environment.txt -Raw
            $candidateOnly = $junit.candidate_only | ConvertTo-Json -Compress
            $baselineOnly = $junit.baseline_only | ConvertTo-Json -Compress

            $doc = @"
# AŞAMA 5B-V — GÜNDEMİM RUNTIME DIFFERENTIAL VALIDATION

Tarih: 2026-07-14

## 1. Summary

Exact current-main baseline ve accepted Stage 5B candidate,
Windows/Python/PySide6 ortamında bağımsız differential validation'dan geçti.
Bu kayıt main merge yetkisi vermez.

## 2. Exact refs ve lineage

- Baseline/current main: ``$($refs.main)``
- Candidate: ``$($refs.candidate)``
- Accepted feature: ``$($refs.feature)``
- Original merge base: ``$($refs.original_merge_base)``
- Stage 5B-V bootstrap commit: ``335a4244859749cb25be6cc7808467ba987fef0f``
- Official validation execution SHA: ``$env:GITHUB_SHA``
- Candidate/main merge base: ``$($refs.merge_base)``
- Candidate ahead/behind main: ``$($refs.ahead) / $($refs.behind)``

## 3. Temporary PR

- PR: ``#334`` — ``TEMP VALIDATION: Agenda Stage 5B-V``
- Base/head: ``main`` ← ``integration/gundemim-current-main-20260713``
- Draft: ``true``
- Final state: closed, unmerged

## 4. Workflow, job and artifact

- Workflow run ID: ``$env:GITHUB_RUN_ID``
- Job ID: ``$jobId``
- Artifact ID/name: ``$env:ARTIFACT_ID`` / ``agenda-stage-05b-v-evidence``
- Artifact size: ``$artifactSize`` bytes
- Artifact digest: ``$env:ARTIFACT_DIGEST``
- Retention: 30 days

## 5. Environment

``````text
$environment
``````

## 6. Requirements parity

- Byte-for-byte equal: ``$($req.equal)``
- Baseline SHA-256: ``$($req.baseline_sha256)``
- Candidate SHA-256: ``$($req.candidate_sha256)``

## 7. Compile, tests, smokes and differential

- Baseline/Candidate compile: PASS/PASS
- Baseline full: ``$($junit.baseline.tests)`` tests; failures/errors/skips ``0/0/0``
- Candidate targeted: ``$($junit.targeted.tests)`` tests; failures/errors/skips ``0/0/0``
- Candidate full: ``$($junit.candidate.tests)`` tests; failures/errors/skips ``0/0/0``
- baseline_only: ``$baselineOnly``
- candidate_only: ``$candidateOnly``
- Agenda schema smoke / database smoke: PASS / PASS

## 8. Schema runtime matrix

Runtime matrisi fresh v18, caller-owned transaction, missing parent,
malformed pre-existing table, genuine v17→v18, current v18 no-op,
future-version fail-closed, exact structural drift cases ve cascade/reopen
davranışlarını doğruladı.

``````json
$schema
``````

## 9. Qt runtime matrix

Gerçek initialize edilmiş QMainWindow harness'ında production widget install,
production tool-window registry, widget/timer idempotency, tek signal etkisi,
status → Agenda → calendar sırası, ``agenda:detail`` open/raise/close/reopen,
permission-loss, file-reset, Agenda closeEvent cleanup ve integer-ID navigation
doğrulandı.

``````json
$qt
``````

## 10. Protected source parity ve cleanup

Current-main protected source blobları exact baseline ile aynı kaldı.
Temporary workflow ve validator bu kayıt commit'inde silindi.
Validation outputları commit edilmedi. Main ve accepted feature refleri değişmedi.

## 11. Gate decision

``````text
STAGE 5A CURRENT-MAIN INTEGRATION AUDIT: ACCEPTED
STAGE 5B CONTROLLED INTEGRATION SOURCE: ACCEPTED
STAGE 5B STATIC/SOURCE TEST GATE: PASS
STAGE 5B WINDOWS/QT RUNTIME GATE: PASS
STAGE 5B SCHEMA V18 RUNTIME GATE: PASS
STAGE 5B BASELINE/CANDIDATE DIFFERENTIAL GATE: PASS
CURRENT-MAIN RUNTIME FIXES: PRESERVED
AGENDA DETAIL TOOL-WINDOW REGISTRY RUNTIME: ACCEPTED
AGENDA UI INSTALL IDEMPOTENCY RUNTIME: ACCEPTED
STAGE 5B-V INTEGRATION VALIDATION: ACCEPTED
FINAL MERGE-READINESS AUDIT GATE: OPEN
MAIN MERGE GATE: CLOSED
``````
"@

            New-Item -ItemType Directory -Force docs/agenda | Out-Null
            Set-Content `
              docs/agenda/AGENDA_STAGE_05B_RUNTIME_VALIDATION.md `
              -Value $doc `
              -Encoding utf8
          }

          Remove-Item `
            .github/workflows/agenda-stage-05b-v-runtime-validation.yml `
            -Force
          Remove-Item `
            tools/validation/agenda_stage_05b_v_runtime_validation.py `
            -Force

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- `
            .github/workflows/agenda-stage-05b-v-runtime-validation.yml `
            tools/validation/agenda_stage_05b_v_runtime_validation.py
          if ($passed) {
            git add -- docs/agenda/AGENDA_STAGE_05B_RUNTIME_VALIDATION.md
            git commit -m 'Record Stage 5B-V runtime differential validation [stage5b-v-cleanup]'
          } else {
            git commit -m 'Clean up failed Stage 5B-V runtime validation [stage5b-v-cleanup]'
          }
          git push origin HEAD:integration/gundemim-current-main-20260713

          $details = if (Test-Path evidence/decision.txt) {
            Get-Content evidence/decision.txt -Raw
          } else {
            'validation evidence missing'
          }
          gh pr close 334 `
            --repo $env:GITHUB_REPOSITORY `
            --comment "Stage 5B-V run $env:GITHUB_RUN_ID completed with $decision. Artifact $env:ARTIFACT_ID, digest $env:ARTIFACT_DIGEST.`n`n$details"

          if (-not $passed) { exit 1 }
