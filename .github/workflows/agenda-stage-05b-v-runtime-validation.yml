name: Agenda Stage 05B-V Runtime Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: agenda-stage-05b-v-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.head_ref == 'integration/gundemim-current-main-20260713'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PYTHONHASHSEED: '0'
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout validation bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: integration/gundemim-current-main-20260713
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip

      - name: Install validation environment
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run Stage 5B-V differential validation
        shell: pwsh
        run: python tools/validation/agenda_stage_05b_v_runtime_validation.py

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agenda-stage-05b-v-evidence
          path: evidence/
          retention-days: 30
          if-no-files-found: warn
