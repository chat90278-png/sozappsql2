name: Dispatch Corrected Agenda Stage 5B-V Runtime Gate

on:
  push:
    branches:
      - integration/gundemim-after-activity-20260714
    paths:
      - .github/workflows/agenda-stage-05b-v-runtime-validation.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch isolated runtime workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run agenda-stage-05b-v-runtime-only.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}"
