name: Agenda Stage 05B-V Runtime Validation

on:
  push:
    branches: [integration/gundemim-current-main-20260713]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: agenda-stage-05b-v-${{ github.ref_name }}-${{ github.event.pull_request.number || 'push' }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.ref_name == 'integration/gundemim-current-main-20260713' || github.head_ref == 'integration/gundemim-current-main-20260713'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PYTHONHASHSEED: '0'
      PR_NUMBER: ${{ github.event.pull_request.number || 334 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/gundemim-current-main-20260713
          fetch-depth: 0
      - name: Record official run start
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 334 --repo $env:GITHUB_REPOSITORY --body "Stage 5B-V official run $env:GITHUB_RUN_ID started for $env:GITHUB_SHA."
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
      - name: Install validation environment
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Run Stage 5B-V differential validation
        shell: pwsh
        continue-on-error: true
        run: python tools/validation/agenda_stage_05b_v_runtime_validation.py
      - name: Upload evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agenda-stage-05b-v-evidence
          path: evidence/
          retention-days: 30
          if-no-files-found: warn
      - name: Finalize branch and close temporary PR
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: |
          $decision = if (Test-Path evidence/decision.txt) { (Get-Content evidence/decision.txt -First 1).Trim() } else { 'FAIL' }
          $passed = $decision -eq 'PASS'
          $jobId = (gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/jobs" --jq '.jobs[0].id' 2>$null)
          $artifactSize = (gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:ARTIFACT_ID" --jq '.size_in_bytes' 2>$null)
          if (-not $jobId) { $jobId = 'unknown' }
          if (-not $artifactSize) { $artifactSize = 'unknown' }
          if ($passed) {
            $refs = Get-Content evidence/refs.json -Raw | ConvertFrom-Json
            $req = Get-Content evidence/requirements-parity.json -Raw | ConvertFrom-Json
            $junit = Get-Content evidence/junit-differential.json -Raw | ConvertFrom-Json
            $qt = Get-Content evidence/qt-runtime.json -Raw
            $environment = Get-Content evidence/environment.txt -Raw
            $candidateOnly = $junit.candidate_only | ConvertTo-Json -Compress
            $baselineOnly = $junit.baseline_only | ConvertTo-Json -Compress
            $doc = @"
# AŞAMA 5B-V — GÜNDEMİM RUNTIME DIFFERENTIAL VALIDATION

Tarih: 2026-07-14

## 1. Summary
Exact current-main baseline ve accepted candidate, Windows/Python/PySide6 ortamında bağımsız differential validation'dan geçti. Bu kayıt main merge yetkisi vermez.

