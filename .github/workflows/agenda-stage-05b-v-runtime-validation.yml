"@
            New-Item -ItemType Directory -Force docs/agenda | Out-Null
            Set-Content docs/agenda/AGENDA_STAGE_05B_RUNTIME_VALIDATION.md -Value $doc -Encoding utf8
          }
          Remove-Item .github/workflows/agenda-stage-05b-v-runtime-validation.yml -Force
          Remove-Item tools/validation/agenda_stage_05b_v_runtime_validation.py -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- .github/workflows/agenda-stage-05b-v-runtime-validation.yml tools/validation/agenda_stage_05b_v_runtime_validation.py
          if ($passed) { git add -- docs/agenda/AGENDA_STAGE_05B_RUNTIME_VALIDATION.md }
          if ($passed) { git commit -m 'Record Stage 5B-V runtime differential validation' } else { git commit -m 'Clean up failed Stage 5B-V runtime validation' }
          git push origin HEAD:integration/gundemim-current-main-20260713
          $details = if (Test-Path evidence/decision.txt) { (Get-Content evidence/decision.txt -Raw) } else { 'validation evidence missing' }
          gh pr close 334 --repo $env:GITHUB_REPOSITORY --comment "Stage 5B-V run $env:GITHUB_RUN_ID completed with $decision. Artifact $env:ARTIFACT_ID, digest $env:ARTIFACT_DIGEST.`n`n$details"
          if (-not $passed) { exit 1 }
