name: Gundemim Stage 3B Runtime Validation

on:
  pull_request:
    types:
      - opened
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-stage3b:
    if: github.head_ref == 'feature/gundemim-agenda-system'
    runs-on: windows-latest
    timeout-minutes: 70
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'

    steps:
      - name: Prepare exact feature source
        shell: pwsh
        run: |
          git init -q
          git remote add origin https://github.com/chat90278-png/sozappsql2.git
          git fetch --depth=1 origin "${{ github.event.pull_request.head.sha }}"
          git checkout --detach FETCH_HEAD
          $actual = (git rev-parse HEAD).Trim()
          Write-Output "GUNDEMIM_STAGE3B_WORKFLOW_FEATURE_SHA=${{ github.event.pull_request.head.sha }}"
          Write-Output "GUNDEMIM_STAGE3B_WORKFLOW_ACTUAL_SHA=$actual"
          if ($actual -ne "${{ github.event.pull_request.head.sha }}") {
            throw "Exact feature SHA materialization failed"
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and prove PySide6
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
          python -c "import PySide6; print('PYSIDE6_IMPORT=PASS', PySide6.__version__)"

      - name: Run Stage 3B runtime gate
        shell: pwsh
        run: |
          python .github/validation/gundemim_stage3b_gate.py --baseline-sha e8db57adff333693b050bd6244d9847b148745b3 --feature-sha "${{ github.event.pull_request.head.sha }}" --repo-url https://github.com/chat90278-png/sozappsql2.git

      - name: Upload validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gundemim-stage3b-runtime-validation
          path: |
            validation-out/*.json
            validation-out/*.xml
            validation-out/*.txt
            validation-out/visual/*.json
            validation-out/visual/*.txt
            validation-out/visual/*.png
          if-no-files-found: warn
          retention-days: 7
