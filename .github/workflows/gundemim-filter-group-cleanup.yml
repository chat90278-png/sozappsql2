name: Gündemim Filter Group Cleanup Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/gundemim-ui-missing-bindings

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install dependencies
        run: |
          python -m pip install --quiet --disable-pip-version-check -r requirements.txt
          python -m pip install --quiet --disable-pip-version-check pytest

      - name: Apply exact two-file patch
        shell: bash
        run: |
          base64 --decode .github/validation/gundemim-filter-group-cleanup.b64 > /tmp/gundemim-filter-group-cleanup.patch
          git apply --check /tmp/gundemim-filter-group-cleanup.patch
          git apply /tmp/gundemim-filter-group-cleanup.patch
          changed=$(git diff --name-only | sort)
          expected=$(printf '%s\n' src/ui/agenda_detail_window.py tests/test_agenda_detail_window.py | sort)
          test "$changed" = "$expected"

      - name: Compile changed files
        run: |
          python -m py_compile src/ui/agenda_detail_window.py tests/test_agenda_detail_window.py

      - name: Run requested pytest command
        shell: bash
        run: |
          mkdir -p validation-out
          set +e
          python3 -m pytest tests/test_agenda_compact_widget.py tests/test_agenda_detail_window.py tests/test_main_page_agenda_integration.py tests/test_staff_agenda_service.py tests/test_agenda_presentation.py -v 2>&1 | tee validation-out/pytest-output.txt
          status=${PIPESTATUS[0]}
          echo "PYTEST_EXIT_CODE=$status" | tee validation-out/pytest-exit-code.txt
          exit "$status"

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gundemim-filter-group-cleanup-validation
          path: validation-out/*
          if-no-files-found: warn
          retention-days: 7

      - name: Commit exact cleanup and remove temporary validation files
        if: success()
        shell: bash
        run: |
          rm .github/workflows/gundemim-filter-group-cleanup.yml
          rm .github/validation/gundemim-filter-group-cleanup.b64
          git add src/ui/agenda_detail_window.py tests/test_agenda_detail_window.py \
            .github/workflows/gundemim-filter-group-cleanup.yml \
            .github/validation/gundemim-filter-group-cleanup.b64
          python - <<'PYCODE'
          import subprocess

          expected = {
              ".github/validation/gundemim-filter-group-cleanup.b64",
              ".github/workflows/gundemim-filter-group-cleanup.yml",
              "src/ui/agenda_detail_window.py",
              "tests/test_agenda_detail_window.py",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only"],
                  text=True,
              ).splitlines()
          )
          if changed != expected:
              raise SystemExit(f"Unexpected staged paths: {sorted(changed)}")
          PYCODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: release replaced agenda filter button groups"
          git push origin HEAD:feature/gundemim-ui-missing-bindings
