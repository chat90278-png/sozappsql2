name: Analysis Center Integration

on:
  push:
    branches:
      - integration/analysis-center-tur21-current-main
  pull_request:
    paths:
      - "analysis_center/**"
      - "src/ui/analysis_center_window.py"
      - "src/ui/main_page_analysis_window.py"
      - "app.py"
      - "tests/test_analysis*.py"
      - "tests/smoke_*analysis*.py"
      - "tests/smoke_*tur*.py"
      - ".github/workflows/analysis-integration.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libopengl0 libxkbcommon-x11-0
      - name: Install dependencies
        run: python -m pip install -q pytest -r requirements.txt
      - name: Compile
        run: python -m compileall -q app.py src analysis_center tests
      - name: Capture first test failure
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short -x > pytest.log 2>&1
          code=$?
          echo "$code" > pytest.exitcode
          exit 0
      - name: Capture current-main release acceptance
        shell: bash
        run: |
          set +e
          python tests/smoke_analysis_center_current_main_acceptance.py > acceptance.log 2>&1
          code=$?
          echo "$code" > acceptance.exitcode
          exit 0
      - name: Upload integration diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: analysis-integration-logs
          path: |
            pytest.log
            pytest.exitcode
            acceptance.log
            acceptance.exitcode
      - name: Enforce integration gate
        shell: bash
        run: |
          echo "pytest exit=$(cat pytest.exitcode)"
          echo "acceptance exit=$(cat acceptance.exitcode)"
          cat pytest.log
          cat acceptance.log
          test "$(cat pytest.exitcode)" = "0"
          test "$(cat acceptance.exitcode)" = "0"
