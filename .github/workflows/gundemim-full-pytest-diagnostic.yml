name: Gundemim Full Pytest Diagnostic

on:
  pull_request:
    types:
      - reopened
    branches:
      - main

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONUNBUFFERED: "1"

jobs:
  diagnose:
    if: github.head_ref == 'feature/gundemim-agenda-system'
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run concise full pytest diagnostic
        run: |
          $expected = "${{ github.event.pull_request.head.sha }}"
          git init -q .
          git remote add origin https://github.com/chat90278-png/sozappsql2.git
          git -c protocol.version=2 fetch --quiet --depth=1 origin $expected
          git checkout --quiet FETCH_HEAD

          $actual = git rev-parse HEAD
          Write-Host "GUNDEMIM_CHECKOUT_SHA=$actual"
          Write-Host "GUNDEMIM_EXPECTED_SHA=$expected"
          if ($actual -ne $expected) {
            throw "Diagnostic checkout SHA mismatch."
          }

          python -m pip install --quiet --disable-pip-version-check -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "requirements install failed" }

          python -m pip install --quiet --disable-pip-version-check pytest
          if ($LASTEXITCODE -ne 0) { throw "pytest install failed" }

          python .github/validation/gundemim_full_pytest_diag.py

      - name: Upload full pytest diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gundemim-full-pytest-diagnostic
          path: |
            validation-out/full-pytest.xml
            validation-out/full-pytest.txt
          if-no-files-found: warn
          retention-days: 7
