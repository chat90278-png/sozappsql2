name: Gundemim Baseline Differential Validation

on:
  pull_request:
    types:
      - opened
    branches:
      - main

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  validate-differential:
    if: github.head_ref == 'feature/gundemim-agenda-system'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Prepare exact feature source
        run: |
          $feature = "${{ github.event.pull_request.head.sha }}"
          Write-Host "GUNDEMIM_WORKFLOW_FEATURE_SHA=$feature"

          git init -q .
          git remote add origin https://github.com/chat90278-png/sozappsql2.git
          git -c protocol.version=2 fetch --quiet --depth=1 origin $feature
          git checkout --quiet FETCH_HEAD

          $actual = git rev-parse HEAD
          Write-Host "GUNDEMIM_WORKFLOW_ACTUAL_SHA=$actual"

          if ($actual -ne $feature) {
            throw "Feature checkout SHA mismatch."
          }

          python -m pip install --quiet --disable-pip-version-check -r requirements.txt
          if ($LASTEXITCODE -ne 0) {
            throw "requirements install failed"
          }

          python -m pip install --quiet --disable-pip-version-check pytest
          if ($LASTEXITCODE -ne 0) {
            throw "pytest install failed"
          }

      - name: Run exact baseline vs feature gate
        run: python .github/validation/gundemim_baseline_feature_gate.py --baseline-sha 2931fa267560397d4d849d6365acde504f376775 --feature-sha "${{ github.event.pull_request.head.sha }}" --repo-url https://github.com/chat90278-png/sozappsql2.git

      - name: Upload differential validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gundemim-baseline-feature-differential
          path: |
            validation-out/*.json
            validation-out/*.xml
            validation-out/*.txt
          if-no-files-found: warn
          retention-days: 7
