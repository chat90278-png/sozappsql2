name: Schema Upgrade Branch Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  schema-upgrade-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: python -m pip install -q -r requirements.txt

      - name: Compile schema upgrade surface
        run: >-
          python -m py_compile
          src/services/sts_schema_upgrade.py
          src/services/sts_schema_upgrade_gate.py
          src/workers/sts_load_worker.py
          tests/test_sts_schema_upgrade.py
          tests/test_sts_schema_upgrade_gate.py

      - name: Run core migration tests repeatedly
        id: core
        continue-on-error: true
        run: |
          for run in 1 2 3 4 5; do
            echo "core migration run ${run}/5"
            python -m pytest -q --tb=short tests/test_sts_schema_upgrade.py
          done

      - name: Run fingerprint gate tests repeatedly
        id: gate
        continue-on-error: true
        run: |
          for run in 1 2 3 4 5; do
            echo "fingerprint gate run ${run}/5"
            python -m pytest -q --tb=short tests/test_sts_schema_upgrade_gate.py
          done

      - name: Fail on focused regression
        if: always() && (steps.core.outcome != 'success' || steps.gate.outcome != 'success')
        run: exit 1

      - name: Run full pytest suite
        if: always() && steps.core.outcome == 'success' && steps.gate.outcome == 'success'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --tb=short
