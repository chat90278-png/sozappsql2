name: Schema Upgrade Branch Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  schema-upgrade-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile schema upgrade surface
        run: >-
          python -m py_compile
          src/services/sts_schema_upgrade.py
          src/services/sts_schema_upgrade_gate.py
          src/workers/sts_load_worker.py
          tests/test_sts_schema_upgrade.py
          tests/test_sts_schema_upgrade_gate.py

      - name: Run focused schema upgrade tests
        id: focused
        continue-on-error: true
        run: >-
          python -m pytest -q
          --junitxml=schema-focused-junit.xml
          tests/test_sts_schema_upgrade.py
          tests/test_sts_schema_upgrade_gate.py

      - name: Upload focused test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-focused-junit
          path: schema-focused-junit.xml
          if-no-files-found: error

      - name: Stop after focused failure
        if: steps.focused.outcome != 'success'
        run: exit 1

      - name: Run full pytest suite
        if: steps.focused.outcome == 'success'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
