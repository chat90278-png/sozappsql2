name: Schema Upgrade Branch Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  schema-upgrade-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Clone feature branch quietly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone -q --depth 1 --branch "${GITHUB_HEAD_REF}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 >/dev/null

      - name: Install runtime and test dependencies
        working-directory: repo
        run: |
          python3 -m pip install -q -r requirements.txt >/dev/null 2>&1
          python3 -m pip install -q pytest >/dev/null 2>&1

      - name: Compile schema upgrade surface
        working-directory: repo
        run: >-
          python3 -m py_compile
          src/services/sts_schema_upgrade.py
          src/services/sts_schema_upgrade_gate.py
          src/workers/sts_load_worker.py
          tests/test_sts_schema_upgrade.py
          tests/test_sts_schema_upgrade_gate.py

      - name: Run combined focused schema tests
        working-directory: repo
        run: >-
          python3 -m pytest -q --tb=short
          tests/test_sts_schema_upgrade.py
          tests/test_sts_schema_upgrade_gate.py

      - name: Run full pytest suite
        working-directory: repo
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 -m pytest -q --tb=short
