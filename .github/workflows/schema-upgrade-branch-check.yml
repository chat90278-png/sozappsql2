name: Schema Upgrade Branch Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  schema-upgrade-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile schema upgrade surface
        run: >-
          python -m py_compile
          src/services/sts_schema_upgrade.py
          src/services/sts_schema_upgrade_gate.py
          src/workers/sts_load_worker.py
          tests/test_sts_schema_upgrade.py
          tests/test_sts_schema_upgrade_gate.py

      - name: Run focused schema upgrade tests
        run: >-
          python -m pytest -q
          tests/test_sts_schema_upgrade.py
          tests/test_sts_schema_upgrade_gate.py

      - name: Run full pytest suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
