name: Schema Upgrade Branch Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  schema-upgrade-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: python -m pip install -q -r requirements.txt

      - name: Compile schema upgrade surface
        run: >-
          python -m py_compile
          src/services/sts_schema_upgrade.py
          src/services/sts_schema_upgrade_gate.py
          src/workers/sts_load_worker.py
          tests/test_sts_schema_upgrade.py
          tests/test_sts_schema_upgrade_gate.py

      - name: Run combined focused schema tests
        id: combined
        continue-on-error: true
        run: >-
          python -m pytest -q --tb=short
          --junitxml=schema-combined-junit.xml
          tests/test_sts_schema_upgrade.py
          tests/test_sts_schema_upgrade_gate.py

      - name: Report combined failure to draft PR
        if: always() && steps.combined.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = ET.parse("schema-combined-junit.xml").getroot()
          lines = ["### Schema focused CI failure diagnostic", ""]
          failed = 0
          for case in root.iter("testcase"):
              nodes = list(case.findall("failure")) + list(case.findall("error"))
              for node in nodes:
                  failed += 1
                  name = f"{case.get('classname', '')}::{case.get('name', '')}".strip(":")
                  message = str(node.get("message") or "").strip()
                  detail = str(node.text or "").strip()
                  lines.extend([
                      f"**{name}**",
                      "```text",
                      (message + "\n" + detail)[-5000:],
                      "```",
                      "",
                  ])
          lines.append(f"failed_cases={failed}")
          Path("schema-combined-failure.md").write_text("\n".join(lines), encoding="utf-8")
          PY
          gh pr comment "${PR_NUMBER}" --body-file schema-combined-failure.md

      - name: Fail if combined focused tests failed
        if: always() && steps.combined.outcome == 'failure'
        run: exit 1

      - name: Run full pytest suite
        if: always() && steps.combined.outcome == 'success'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --tb=short
