name: Bootstrap merge validation hotfix

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: write

jobs:
  bootstrap-hotfix:
    if: ${{ github.head_ref == 'hotfix/resolved-merge-validation-ui' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install workflow parser
        run: python -m pip install pyyaml

      - name: Execute verified hotfix runner steps
        env:
          HOTFIX_RUNNER_PATH: .github/workflows/hotfix_apply_merge_validation.yml
        run: |
          python - <<'PY'
          from __future__ import annotations

          import os
          import subprocess
          from pathlib import Path

          import yaml

          runner_path = Path(os.environ["HOTFIX_RUNNER_PATH"])
          data = yaml.safe_load(runner_path.read_text(encoding="utf-8"))
          steps = data["jobs"]["apply-hotfix"]["steps"]
          for step in steps:
              command = step.get("run")
              if not command:
                  continue
              name = step.get("name", "unnamed run step")
              print(f"\n===== {name} =====", flush=True)
              env = os.environ.copy()
              env.update({str(k): str(v) for k, v in dict(step.get("env") or {}).items()})
              subprocess.run(
                  command,
                  shell=True,
                  check=True,
                  executable="/bin/bash",
                  env=env,
              )
          PY

      - name: Remove PR bootstrap runner
        env:
          HOTFIX_BRANCH: ${{ github.head_ref }}
        run: |
          rm .github/workflows/hotfix_apply_merge_validation_pr.yml
          git config user.name "STS Hotfix Runner"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove temporary hotfix runner [hotfix-cleanup]"
          git push origin HEAD:${HOTFIX_BRANCH}
