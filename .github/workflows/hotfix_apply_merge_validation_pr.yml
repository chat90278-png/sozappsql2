name: Verify merge validation hotfix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  verify-hotfix:
    if: ${{ github.head_ref == 'hotfix/resolved-merge-validation-ui' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q pytest
          python -m pip install -q -r requirements.txt

      - name: Normalize generated regression indentation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one indentation replacement, found {count}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "tests/test_share_assignment_merge.py",
              "        if item.is_conflict:\n  controller.set_decision(item.target.target_id, MergeDecisionKind.REMOTE_USE)",
              "        if item.is_conflict:\n            controller.set_decision(item.target.target_id, MergeDecisionKind.REMOTE_USE)",
          )
          replace_once(
              "tests/test_share_merge_dialog.py",
              """        conflict_combos = [\n  combo\n  for target_id, combo in dialog._decision_combos.items()\n  if (dialog.controller.item_by_target(target_id) and dialog.controller.item_by_target(target_id).is_conflict)\n        ]""",
              """        conflict_combos = [\n            combo\n            for target_id, combo in dialog._decision_combos.items()\n            if (dialog.controller.item_by_target(target_id) and dialog.controller.item_by_target(target_id).is_conflict)\n        ]""",
          )
          replace_once(
              "tests/test_share_merge_dialog.py",
              "        for combo in conflict_combos[:-1]:\n  _choose(combo, MergeDecisionKind.REMOTE_USE)",
              "        for combo in conflict_combos[:-1]:\n            _choose(combo, MergeDecisionKind.REMOTE_USE)",
          )
          replace_once(
              "tests/test_share_merge_presenter.py",
              """        issues=[\n  MergeResolutionIssue(\n      \"ABSENT_DELIVERY_PARENT_SYSTEM\",\n      \"raw uid-secret deadbeef {'payload_json': true}\",\n      (\"uid-secret\",),\n  ),\n  MergeResolutionIssue(\n      \"ABSENT_FILE_PARENT_FOLDER\",\n      \"raw file graph payload\",\n      (\"file-secret\",),\n  ),\n        ],""",
              """        issues=[\n            MergeResolutionIssue(\n                \"ABSENT_DELIVERY_PARENT_SYSTEM\",\n                \"raw uid-secret deadbeef {'payload_json': true}\",\n                (\"uid-secret\",),\n            ),\n            MergeResolutionIssue(\n                \"ABSENT_FILE_PARENT_FOLDER\",\n                \"raw file graph payload\",\n                (\"file-secret\",),\n            ),\n        ],""",
          )
          PY

      - name: Assignment regression
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests/test_share_assignment_merge.py 2>&1 | tee assignment-regression.log

      - name: Presenter regression
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests/test_share_merge_presenter.py 2>&1 | tee presenter-regression.log

      - name: Core merge regression
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests/test_share_merge_apply.py tests/test_share_merge_prepare.py tests/test_share_merge_resolution.py tests/test_share_merge_end_to_end.py 2>&1 | tee core-regression.log

      - name: Qt dialog regression
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests/test_share_merge_dialog.py -rs 2>&1 | tee qt-regression.log

      - name: Compile and diff checks
        run: |
          python -m compileall -q app.py src
          git diff --check

      - name: Full pytest
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rs 2>&1 | tee hotfix-full-pytest.txt

      - name: Upload verification failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hotfix-verification-logs
          path: |
            assignment-regression.log
            presenter-regression.log
            core-regression.log
            qt-regression.log
            hotfix-full-pytest.txt
          if-no-files-found: warn

      - name: Finalize verified hotfix
        if: success()
        env:
          HOTFIX_BRANCH: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          from pathlib import Path
          report = Path("docs/stage_reports/HOTFIX_MERGE_PLAN_VALIDATION_UI.md")
          output = Path("hotfix-full-pytest.txt").read_text(encoding="utf-8", errors="replace").strip()
          text = report.read_text(encoding="utf-8")
          text = text.replace(
              "Workflow tamamlandığında gerçek full pytest çıktısı aşağıya otomatik eklenecektir.",
              "```text\n" + output + "\n```",
          )
          report.write_text(text, encoding="utf-8")
          PY
          rm -f assignment-regression.log presenter-regression.log core-regression.log qt-regression.log hotfix-full-pytest.txt
          rm -f .github/workflows/hotfix_apply_merge_validation.yml
          rm -f .github/workflows/hotfix_apply_merge_validation_pr.yml
          rm -f docs/stage_reports/HOTFIX_WORKFLOW_FAILURE.log
          git config user.name "STS Hotfix Runner"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix resolved merge validation and dialog state [hotfix-verified]"
          git push origin HEAD:${HOTFIX_BRANCH}
