name: Bootstrap merge validation hotfix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  bootstrap-hotfix:
    if: ${{ github.head_ref == 'hotfix/resolved-merge-validation-ui' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Determine phase
        id: phase
        shell: bash
        run: |
          subject="$(git log -1 --pretty=%s)"
          if [[ "$subject" == *"[hotfix-verified]"* ]]; then
            phase=done
          elif grep -q 'resolution_base_snapshot' src/services/share_merge_service.py \
            && grep -q 'structural_validation_message' src/ui/presenters/share_merge_presenter.py \
            && grep -q 'shareMergeDecisionCaption' src/ui/dialogs/share_merge_dialog.py; then
            phase=verify
          elif [[ "$subject" == *"[hotfix-diagnostic]"* ]]; then
            phase=diagnostic
          else
            phase=patch
          fi
          echo "name=$phase" >> "$GITHUB_OUTPUT"
          echo "HEAD subject: $subject"
          echo "Phase: $phase"

      - name: Set up Python
        if: steps.phase.outputs.name == 'patch' || steps.phase.outputs.name == 'verify'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply source and regression patch
        if: steps.phase.outputs.name == 'patch'
        env:
          HOTFIX_RUNNER_PATH: .github/workflows/hotfix_apply_merge_validation.yml
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee hotfix-patch.log
          from __future__ import annotations

          import os
          import subprocess
          from pathlib import Path

          runner_path = Path(os.environ["HOTFIX_RUNNER_PATH"])
          text = runner_path.read_text(encoding="utf-8")
          start_marker = "      - name: Apply precise source and regression patch\n        shell: bash\n        run: |\n"
          end_marker = "\n      - name: Install dependencies\n"
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise RuntimeError("Hotfix patch runner markers are not unique")
          block = text.split(start_marker, 1)[1].split(end_marker, 1)[0]
          command = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          )
          proc = subprocess.run(
              command,
              shell=True,
              check=False,
              executable="/bin/bash",
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
          )
          print(proc.stdout or "")
          raise SystemExit(proc.returncode)
          PY

      - name: Commit patch for verification
        if: steps.phase.outputs.name == 'patch' && success()
        env:
          HOTFIX_BRANCH: ${{ github.head_ref }}
        run: |
          rm -f hotfix-patch.log
          git config user.name "STS Hotfix Runner"
          git config user.email "actions@users.noreply.github.com"
          git add src tests docs/stage_reports/HOTFIX_MERGE_PLAN_VALIDATION_UI.md
          git diff --cached --check
          git commit -m "Apply resolved merge validation hotfix [hotfix-patch]"
          git push origin HEAD:${HOTFIX_BRANCH}

      - name: Persist patch failure diagnostic
        if: steps.phase.outputs.name == 'patch' && failure()
        env:
          HOTFIX_BRANCH: ${{ github.head_ref }}
        run: |
          git reset --hard HEAD
          mkdir -p docs/stage_reports
          cp hotfix-patch.log docs/stage_reports/HOTFIX_WORKFLOW_FAILURE.log
          git config user.name "STS Hotfix Runner"
          git config user.email "actions@users.noreply.github.com"
          git add docs/stage_reports/HOTFIX_WORKFLOW_FAILURE.log
          git commit -m "Record hotfix patch failure [hotfix-diagnostic]"
          git push origin HEAD:${HOTFIX_BRANCH}

      - name: Install dependencies
        if: steps.phase.outputs.name == 'verify'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Assignment regression
        if: steps.phase.outputs.name == 'verify'
        run: python -m pytest -q tests/test_share_assignment_merge.py

      - name: Presenter regression
        if: steps.phase.outputs.name == 'verify'
        run: python -m pytest -q tests/test_share_merge_presenter.py

      - name: Core merge regression
        if: steps.phase.outputs.name == 'verify'
        run: python -m pytest -q tests/test_share_merge_apply.py tests/test_share_merge_prepare.py tests/test_share_merge_resolution.py tests/test_share_merge_end_to_end.py

      - name: Qt dialog regression
        if: steps.phase.outputs.name == 'verify'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_share_merge_dialog.py -rs

      - name: Compile and diff checks
        if: steps.phase.outputs.name == 'verify'
        run: |
          python -m compileall -q app.py src
          git diff --check

      - name: Full pytest
        if: steps.phase.outputs.name == 'verify'
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rs | tee hotfix-full-pytest.txt

      - name: Finalize verified hotfix
        if: steps.phase.outputs.name == 'verify' && success()
        env:
          HOTFIX_BRANCH: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          from pathlib import Path
          report = Path("docs/stage_reports/HOTFIX_MERGE_PLAN_VALIDATION_UI.md")
          output = Path("hotfix-full-pytest.txt").read_text(encoding="utf-8", errors="replace").strip()
          text = report.read_text(encoding="utf-8")
          text = text.replace(
              "Workflow tamamlandığında gerçek full pytest çıktısı aşağıya otomatik eklenecektir.",
              "```text\n" + output + "\n```",
          )
          report.write_text(text, encoding="utf-8")
          PY
          rm -f hotfix-full-pytest.txt
          rm -f .github/workflows/hotfix_apply_merge_validation.yml
          rm -f .github/workflows/hotfix_apply_merge_validation_pr.yml
          rm -f docs/stage_reports/HOTFIX_WORKFLOW_FAILURE.log
          git config user.name "STS Hotfix Runner"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix resolved merge validation and dialog state [hotfix-verified]"
          git push origin HEAD:${HOTFIX_BRANCH}

      - name: Verification failure summary
        if: steps.phase.outputs.name == 'verify' && failure()
        run: |
          echo "Verification failed. No verification commit was created."
          git status --short
