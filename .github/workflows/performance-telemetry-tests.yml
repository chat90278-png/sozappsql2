name: Performance telemetry tests

on:
  pull_request:
    paths:
      - "src/services/perf_tracker.py"
      - "src/ui/dialogs/performance_tracking.py"
      - "tests/test_perf_tracker_v2.py"
      - "tests/test_performance_tracking_dialog_v2.py"
      - ".github/workflows/performance-telemetry-tests.yml"
  push:
    paths:
      - "src/services/perf_tracker.py"
      - "src/ui/dialogs/performance_tracking.py"
      - "tests/test_perf_tracker_v2.py"
      - "tests/test_performance_tracking_dialog_v2.py"
      - ".github/workflows/performance-telemetry-tests.yml"

permissions:
  contents: read

jobs:
  telemetry-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --upgrade pytest PySide6==6.11.1

      - name: Compile changed modules
        run: |
          python -m py_compile src/services/perf_tracker.py
          python -m py_compile src/ui/dialogs/performance_tracking.py
          python -m py_compile tests/test_perf_tracker_v2.py
          python -m py_compile tests/test_performance_tracking_dialog_v2.py

      - name: Run telemetry and dialog regression tests
        run: |
          python -m pytest -q \
            tests/test_perf_tracker_v2.py \
            tests/test_performance_tracking_dialog_v2.py
