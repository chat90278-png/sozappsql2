name: Performance telemetry tests

on:
  pull_request:
    paths:
      - "src/services/perf_tracker.py"
      - "src/ui/dialogs/performance_tracking.py"
      - "tests/test_perf_tracker_v2.py"
      - ".github/workflows/performance-telemetry-tests.yml"
  push:
    branches:
      - main
    paths:
      - "src/services/perf_tracker.py"
      - "src/ui/dialogs/performance_tracking.py"
      - "tests/test_perf_tracker_v2.py"
      - ".github/workflows/performance-telemetry-tests.yml"

permissions:
  contents: read

jobs:
  telemetry-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependency
        run: python -m pip install --upgrade pytest

      - name: Compile changed modules
        run: |
          python -m py_compile src/services/perf_tracker.py
          python -m py_compile src/ui/dialogs/performance_tracking.py
          python -m py_compile tests/test_perf_tracker_v2.py

      - name: Run telemetry regression tests
        run: python -m pytest -q tests/test_perf_tracker_v2.py
