name: Performance telemetry tests

on:
  pull_request:
    paths:
      - "src/services/perf_tracker.py"
      - "src/ui/dialogs/performance_tracking.py"
      - "tests/test_perf_tracker_v2.py"
      - "tests/test_performance_tracking_dialog_v2.py"
      - ".github/workflows/performance-telemetry-tests.yml"
  push:
    paths:
      - "src/services/perf_tracker.py"
      - "src/ui/dialogs/performance_tracking.py"
      - "tests/test_perf_tracker_v2.py"
      - "tests/test_performance_tracking_dialog_v2.py"
      - ".github/workflows/performance-telemetry-tests.yml"

permissions:
  contents: read

jobs:
  telemetry-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade \
            pytest \
            PySide6==6.11.1 \
            openpyxl==3.1.5

      - name: Compile changed modules
        run: |
          python -m py_compile src/services/perf_tracker.py
          python -m py_compile src/ui/dialogs/performance_tracking.py
          python -m py_compile tests/test_perf_tracker_v2.py
          python -m py_compile tests/test_performance_tracking_dialog_v2.py

      - name: Run telemetry and dialog regression tests
        id: regression_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_perf_tracker_v2.py \
            tests/test_performance_tracking_dialog_v2.py \
            > performance-test-output.txt 2>&1

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-test-output
          path: performance-test-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Fail when regression tests fail
        if: steps.regression_tests.outcome == 'failure'
        run: |
          cat performance-test-output.txt
          exit 1
