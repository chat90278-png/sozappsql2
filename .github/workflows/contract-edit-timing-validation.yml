name: Contract Edit Timing Validation

on:
  pull_request:
    paths:
      - "app.py"
      - "src/ui/dialogs/contract_edit_timing_runtime_fix.py"
      - "tests/test_contract_edit_timing_runtime_fix.py"
      - ".github/workflows/contract-edit-timing-validation.yml"
  workflow_dispatch:

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-qt

      - name: Compile changed modules
        run: |
          python -m py_compile app.py
          python -m py_compile src/ui/dialogs/contract_edit_timing_runtime_fix.py
          python -m py_compile tests/test_contract_edit_timing_runtime_fix.py

      - name: Run targeted regression tests
        run: python -m pytest -q tests/test_contract_edit_timing_runtime_fix.py
